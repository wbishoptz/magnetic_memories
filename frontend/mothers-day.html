<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mother's Day | Magnetic Memories</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Nunito', 'sans-serif'], serif: ['Cormorant Garamond', 'serif'] },
          colors: {
            background: "hsl(30 30% 98%)", foreground: "hsl(270 20% 18%)",
            primary: "hsl(280 45% 55%)", "primary-foreground": "white",
            secondary: "hsl(280 30% 95%)", "secondary-foreground": "hsl(280 45% 40%)",
            accent: "hsl(30 60% 72%)", muted: "hsl(140 15% 93%)"
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'flower-float': 'flowerFloat 4s ease-in-out infinite',
            'flower-float-delayed': 'flowerFloat 4s ease-in-out 1.5s infinite',
            'petal-drift': 'petalDrift 6s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: { from: { opacity: 0, transform: 'translateY(10px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
            flowerFloat: { '0%, 100%': { transform: 'translateY(0) rotate(-3deg)' }, '50%': { transform: 'translateY(-12px) rotate(3deg)' } },
            petalDrift: { '0%': { transform: 'translateY(-10px) translateX(-10px) rotate(0deg)', opacity: 0 }, '50%': { opacity: 1 }, '100%': { transform: 'translateY(20px) translateX(20px) rotate(45deg)', opacity: 0 } }
          }
        }
      }
    }
  </script>

  <style>
    body { background: linear-gradient(to bottom right, #fff5f8, #f5f3ff); min-height: 100vh; color: hsl(270 20% 18%); overflow-x: hidden; }
    .mothers-card { background: linear-gradient(to bottom right, white, #faf5ff); box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.1); }
    .mothers-btn { background: linear-gradient(135deg, hsl(280 45% 55%), hsl(280 45% 45%)); color: white; box-shadow: 0 4px 15px -3px rgba(168, 85, 247, 0.4); }
    .mothers-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photo-slot { aspect-ratio: 1; border-radius: 12px; background: rgba(0,0,0,0.05); border: 2px dashed rgba(168, 85, 247, 0.3); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; }
    .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
    
    /* Background decorations */
    .bg-deco { position: fixed; pointer-events: none; z-index: -1; opacity: 0.4; }
  </style>
</head>
<body class="pb-24">

  <div class="bg-deco top-[10%] left-[5%] text-4xl animate-flower-float">🌸</div>
  <div class="bg-deco top-[20%] right-[10%] text-5xl animate-flower-float-delayed">🌷</div>
  <div class="bg-deco bottom-[30%] left-[15%] text-3xl animate-flower-float">🌺</div>
  <div class="bg-deco bottom-[10%] right-[20%] text-4xl animate-flower-float-delayed">💐</div>

  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-primary/10">
    <div class="flex items-center justify-between px-4 py-3 max-w-md mx-auto">
      <button onclick="goBack()" class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center hover:bg-secondary/80 transition-colors">
        <i data-lucide="chevron-left" class="w-5 h-5 text-secondary-foreground"></i>
      </button>
      <h1 class="font-serif text-lg font-bold text-primary">Mother's Day</h1>
      <div class="w-10"></div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6 max-w-md relative z-10">

    <div id="step-landing" class="animate-fade-in text-center">
      <div class="mb-6">
        <img src="./logo.png" alt="Magnetic Memories" class="w-48 md:w-56 mx-auto mb-4 object-contain" />
        <p class="text-primary font-serif text-2xl font-bold mb-8">Mother's Day Edition</p>
      </div>

      <div class="space-y-4">
        
        <button onclick="selectLine('frames')" class="w-full p-6 rounded-2xl text-left transition-all duration-300 border-2 border-transparent mothers-card hover:border-primary/30 flex items-center gap-4">
          <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center flex-shrink-0">
            <i data-lucide="frame" class="w-7 h-7 text-white"></i>
          </div>
          <div>
            <h3 class="font-serif text-xl font-semibold mb-1">Photo Frames</h3>
            <p class="text-sm text-muted-foreground">Beautiful magnetic frames in Bohemian & Sleek styles</p>
          </div>
        </button>
        
        <button onclick="selectLine('magnets')" class="w-full p-6 rounded-2xl text-left transition-all duration-300 border-2 border-transparent mothers-card hover:border-primary/30 flex items-center gap-4">
          <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center flex-shrink-0">
            <i data-lucide="image" class="w-7 h-7 text-white"></i>
          </div>
          <div>
            <h3 class="font-serif text-xl font-semibold mb-1">Photo Magnets</h3>
            <p class="text-sm text-muted-foreground">Custom photo magnets + special pre-made designs for Mum</p>
          </div>
        </button>

      </div>
    </div>

    <div id="step-packages" class="hidden animate-fade-in">
      <div class="text-center mb-6">
        <h2 class="font-serif text-2xl font-bold mb-2">Choose Your Package</h2>
        <p class="text-sm text-muted-foreground">Each magnet is 50×50mm premium quality</p>
      </div>
      <div class="space-y-3" id="package-list"></div>
    </div>

    <div id="step-frames" class="hidden animate-fade-in">
      <div class="text-center mb-6">
        <h2 class="font-serif text-2xl font-bold mb-2">Choose Frame</h2>
      </div>
      <div class="space-y-4 mb-6">
        <label class="block text-xs font-bold uppercase text-muted-foreground mb-2">1. Style</label>
        <div class="grid grid-cols-2 gap-3" id="frame-styles"></div>
        
        <label class="block text-xs font-bold uppercase text-muted-foreground mb-2 mt-4">2. Color</label>
        <div class="grid grid-cols-3 gap-3" id="frame-colors"></div>

        <label class="block text-xs font-bold uppercase text-muted-foreground mb-2 mt-4">3. Size</label>
        <div class="grid grid-cols-2 gap-3" id="frame-sizes"></div>
      </div>
    </div>

    <div id="step-photos" class="hidden animate-fade-in">
      <div class="text-center mb-6">
        <h2 class="font-serif text-2xl font-bold mb-2">Upload Photos</h2>
        <p class="text-sm text-muted-foreground">Select <span id="photo-target">0</span> photos of your favourite moments</p>
      </div>
      
      <div class="photo-grid mb-6" id="photo-grid"></div>
      <input type="file" id="fileInput" multiple accept="image/*" class="hidden" />

      <div class="p-4 rounded-xl bg-secondary border border-primary/20 flex justify-between items-center">
        <span class="font-medium text-primary"><span id="photo-count">0</span> / <span id="photo-req">0</span> Uploaded</span>
      </div>
    </div>

    <div id="step-premade" class="hidden animate-fade-in">
      <div class="text-center mb-6">
        <h2 class="font-serif text-2xl font-bold mb-2">Choose Designs</h2>
        <p class="text-sm text-muted-foreground">Select <span id="premade-target">0</span> pre-made designs for Mum</p>
      </div>
      <div class="grid grid-cols-2 gap-3" id="premade-grid"></div>
    </div>

    <div id="step-checkout" class="hidden animate-fade-in">
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-full bg-secondary flex items-center justify-center mx-auto mb-4">
          <i data-lucide="sparkles" class="w-8 h-8 text-primary"></i>
        </div>
        <h2 class="font-serif text-2xl font-bold mb-1">Review Your Order</h2>
      </div>

      <div class="mothers-card rounded-2xl p-5 mb-6 space-y-4">
        <div class="flex justify-between items-center border-b border-black/5 pb-4">
          <div>
            <h3 class="font-serif font-bold text-lg" id="summary-title">Package Name</h3>
            <p class="text-sm text-muted-foreground" id="summary-desc">Details</p>
          </div>
          <span class="text-xl font-bold text-primary" id="summary-price">£0.00</span>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-muted-foreground mb-2">Delivery</label>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="setShipping('GI_COLLECT')" id="ship-collect" class="border-2 rounded-xl p-3 text-center transition-all">
              <div class="font-bold text-sm">Collection</div><div class="text-xs text-green-600">Free</div>
            </button>
            <button onclick="setShipping('GI_DELIVER')" id="ship-deliver" class="border-2 rounded-xl p-3 text-center transition-all">
              <div class="font-bold text-sm">Delivery</div><div class="text-xs text-primary">+£3.00</div>
            </button>
          </div>
        </div>

        <div class="space-y-3 pt-4">
          <input type="email" id="email" placeholder="Email address" class="w-full p-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none" />
          <input type="tel" id="phone" placeholder="Phone number" class="w-full p-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none" />
        </div>
      </div>
    </div>

  </main>

  <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t border-primary/10 z-40">
    <div class="container max-w-md mx-auto">
      <button id="main-btn" onclick="handleNext()" class="w-full h-14 rounded-xl mothers-btn font-bold text-lg flex items-center justify-center gap-2 transition-all">
        Continue <i data-lucide="arrow-right" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // --- DATA ---
    const PACKAGES = [
      { id: 1, name: "Bouquet Bloom", custom: 3, premade: 1, price: 12.50 },
      { id: 2, name: "Garden Party", custom: 6, premade: 2, price: 25.00, popular: true },
      { id: 3, name: "Full Bloom", custom: 9, premade: 3, price: 30.00 },
      { id: 4, name: "Mum's Treasure", custom: 12, premade: 3, price: 35.00 }, 
    ];

    const PREMADES = [
      { id: 1, name: "Best Mum", icon: "💐", color: "bg-gradient-to-br from-purple-300 to-pink-400" },
      { id: 2, name: "Love You Mum", icon: "💜", color: "bg-gradient-to-br from-pink-300 to-rose-400" },
      { id: 3, name: "Super Mum", icon: "🦸‍♀️", color: "bg-gradient-to-br from-violet-300 to-purple-400" },
      { id: 4, name: "Mum's Garden", icon: "🌷", color: "bg-gradient-to-br from-green-200 to-emerald-300" },
      { id: 5, name: "#1 Mum", icon: "🏆", color: "bg-gradient-to-br from-amber-200 to-orange-300" },
      { id: 6, name: "With Love", icon: "🌸", color: "bg-gradient-to-br from-rose-200 to-pink-300" },
    ];

    const FRAMES = {
      bohemian: { name: "Bohemian", sizes: [{m:3,p:15}, {m:4,p:17}, {m:6,p:25}, {m:9,p:30}] },
      sleek: { name: "Sleek", sizes: [{m:1,p:7}, {m:2,p:12}, {m:3,p:15}, {m:4,p:17}] }
    };
    const COLORS = ['White', 'Black', 'Olive', 'Black Walnut', 'White Marble'];

    // --- STATE ---
    let state = {
      step: 'landing', 
      line: null, 
      
      // Magnets
      pkg: null,
      selectedPremades: [],
      
      // Frames
      frameStyle: 'bohemian',
      frameSize: null,
      frameColor: 'White',

      photos: [],
      shipping: 'GI_COLLECT'
    };

    // --- RENDER ---
    function render() {
      // Visibility
      ['landing', 'packages', 'frames', 'photos', 'premade', 'checkout'].forEach(s => {
        document.getElementById(`step-${s}`).style.display = (state.step === s) ? 'block' : 'none';
      });

      const btn = document.getElementById('main-btn');
      let valid = false;
      let text = "Continue";

      if(state.step === 'landing') {
        valid = !!state.line;
      } else if (state.step === 'packages') {
        valid = !!state.pkg;
      } else if (state.step === 'frames') {
        valid = !!state.frameSize;
      } else if (state.step === 'photos') {
        const req = state.line === 'magnets' ? state.pkg.custom : state.frameSize.m;
        valid = state.photos.length === req;
      } else if (state.step === 'premade') {
        valid = state.selectedPremades.length === state.pkg.premade;
      } else if (state.step === 'checkout') {
        valid = true;
        const price = state.line === 'magnets' ? state.pkg.price : state.frameSize.p;
        const ship = state.shipping === 'GI_DELIVER' ? 3 : 0;
        text = `Pay £${(price + ship).toFixed(2)}`;
      }

      btn.disabled = !valid;
      btn.style.opacity = valid ? '1' : '0.5';
      btn.innerHTML = state.step === 'checkout' ? text : `${text} <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>`;
      lucide.createIcons();

      if(state.step === 'packages') renderPackages();
      if(state.step === 'frames') renderFrames();
      if(state.step === 'photos') renderPhotos();
      if(state.step === 'premade') renderPremades();
      if(state.step === 'checkout') renderCheckout();
    }

    // --- LOGIC ---
    window.selectLine = (line) => {
      state.line = line;
      state.step = line === 'magnets' ? 'packages' : 'frames';
      render();
    };

    function renderPackages() {
      document.getElementById('package-list').innerHTML = PACKAGES.map(p => `
        <button onclick="state.pkg=${p.id}; render();" class="w-full relative p-5 rounded-2xl text-left transition-all duration-300 border-2 ${state.pkg === p.id ? 'border-primary bg-secondary/50' : 'border-transparent mothers-card hover:border-primary/30'}">
          ${p.popular && state.pkg !== p.id ? '<div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-primary text-white text-xs font-bold px-3 py-1 rounded-full">Most Popular</div>' : ''}
          <h3 class="font-serif text-lg font-bold mb-2">${p.name}</h3>
          <div class="flex flex-col gap-1 text-sm text-foreground mb-4">
            <div class="flex items-center gap-2"><i data-lucide="flower-2" class="w-4 h-4 text-primary"></i> ${p.custom} custom photos</div>
            <div class="flex items-center gap-2 text-muted-foreground"><i data-lucide="flower-2" class="w-4 h-4 text-accent"></i> ${p.premade} pre-made designs</div>
          </div>
          <div class="text-2xl font-bold text-primary">£${p.price.toFixed(2)}</div>
        </button>
      `).join('');
      lucide.createIcons();
    }

    function renderFrames() {
      document.getElementById('frame-styles').innerHTML = Object.keys(FRAMES).map(s => `
        <button onclick="state.frameStyle='${s}'; state.frameSize=null; render();" class="border-2 rounded-xl p-3 font-bold ${state.frameStyle===s ? 'border-primary bg-secondary' : 'bg-white'}">${FRAMES[s].name}</button>
      `).join('');
      
      document.getElementById('frame-colors').innerHTML = COLORS.map(c => `
        <button onclick="state.frameColor='${c}'; render();" class="border-2 rounded-xl p-2 text-xs font-bold ${state.frameColor===c ? 'border-primary bg-secondary' : 'bg-white'}">${c}</button>
      `).join('');

      document.getElementById('frame-sizes').innerHTML = FRAMES[state.frameStyle].sizes.map(s => `
        <button onclick="state.frameSize={m:${s.m}, p:${s.p}}; render();" class="border-2 rounded-xl p-3 ${state.frameSize?.m===s.m ? 'border-primary bg-secondary' : 'bg-white'}">
          <div class="font-bold text-lg">${s.m} Magnets</div>
          <div class="text-primary font-bold">£${s.p.toFixed(2)}</div>
        </button>
      `).join('');
    }

    function renderPhotos() {
      const req = state.line === 'magnets' ? state.pkg.custom : state.frameSize.m;
      document.getElementById('photo-target').innerText = req;
      document.getElementById('photo-req').innerText = req;
      document.getElementById('photo-count').innerText = state.photos.length;

      let html = state.photos.map((p, i) => `
        <div class="photo-slot bg-white border-solid border-primary">
          <img src="${p}">
          <button onclick="state.photos.splice(${i},1); render();" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1"><i data-lucide="x" class="w-3 h-3"></i></button>
        </div>
      `).join('');

      if(state.photos.length < req) {
        html += `<div onclick="document.getElementById('fileInput').click()" class="photo-slot text-primary flex-col hover:bg-primary/5 transition-colors"><i data-lucide="camera" class="w-6 h-6 mb-1"></i><span class="text-xs font-bold">Add</span></div>`;
      }
      document.getElementById('photo-grid').innerHTML = html;
      lucide.createIcons();
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const req = state.line === 'magnets' ? state.pkg.custom : state.frameSize.m;
      const remaining = req - state.photos.length;
      Array.from(e.target.files).slice(0, remaining).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => { state.photos.push(e.target.result); render(); };
        reader.readAsDataURL(file);
      });
    });

    function renderPremades() {
      document.getElementById('premade-target').innerText = state.pkg.premade;
      document.getElementById('premade-grid').innerHTML = PREMADES.map(p => {
        const sel = state.selectedPremades.includes(p.id);
        const disabled = !sel && state.selectedPremades.length >= state.pkg.premade;
        return `
          <button onclick="togglePremade(${p.id})" ${disabled?'disabled':''} class="relative aspect-square rounded-xl overflow-hidden border-2 transition-all ${sel ? 'border-primary ring-2 ring-primary/20' : 'border-transparent'} ${disabled?'opacity-40':''}">
            <div class="w-full h-full flex items-center justify-center ${p.color}"><span class="text-4xl">${p.icon}</span></div>
            ${sel ? '<div class="absolute top-2 right-2 w-6 h-6 bg-primary rounded-full flex items-center justify-center"><i data-lucide="check" class="w-4 h-4 text-white"></i></div>' : ''}
            <div class="absolute bottom-0 left-0 right-0 bg-black/50 p-2 text-white text-xs font-bold">${p.name}</div>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    window.togglePremade = (id) => {
      if(state.selectedPremades.includes(id)) {
        state.selectedPremades = state.selectedPremades.filter(x => x !== id);
      } else if (state.selectedPremades.length < state.pkg.premade) {
        state.selectedPremades.push(id);
      }
      render();
    };

    window.setShipping = (m) => {
      state.shipping = m;
      document.getElementById('ship-collect').className = `border-2 rounded-xl p-3 text-center transition-all ${m==='GI_COLLECT' ? 'border-primary bg-secondary' : 'bg-white'}`;
      document.getElementById('ship-deliver').className = `border-2 rounded-xl p-3 text-center transition-all ${m==='GI_DELIVER' ? 'border-primary bg-secondary' : 'bg-white'}`;
      render();
    };

    function renderCheckout() {
      let name, desc, price;
      if(state.line === 'magnets') {
        const p = PACKAGES.find(x => x.id === state.pkg);
        name = p.name;
        desc = `${p.custom} Photos + ${p.premade} Designs`;
        price = p.price;
      } else {
        name = `${FRAMES[state.frameStyle].name} Frame (${state.frameColor})`;
        desc = `${state.frameSize.m} Custom Photos`;
        price = state.frameSize.p;
      }
      document.getElementById('summary-title').innerText = name;
      document.getElementById('summary-desc').innerText = desc;
      document.getElementById('summary-price').innerText = `£${price.toFixed(2)}`;
    }

    // --- NAVIGATION ---
    window.handleNext = async () => {
      if (state.step === 'landing') state.step = state.line === 'magnets' ? 'packages' : 'frames';
      else if (state.step === 'packages') state.step = 'photos';
      else if (state.step === 'frames') state.step = 'photos';
      else if (state.step === 'photos') state.step = state.line === 'magnets' ? 'premade' : 'checkout';
      else if (state.step === 'premade') state.step = 'checkout';
      else if (state.step === 'checkout') await submitOrder();
      render();
    };

    window.goBack = () => {
      if (state.step === 'packages' || state.step === 'frames') state.step = 'landing';
      else if (state.step === 'photos') state.step = state.line === 'magnets' ? 'packages' : 'frames';
      else if (state.step === 'premade') state.step = 'photos';
      else if (state.step === 'checkout') state.step = state.line === 'magnets' ? 'premade' : 'photos';
      else window.location.href = '/';
      render();
    };

    async function submitOrder() {
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      if(!email || !phone) return alert("Please enter email & phone");

      const btn = document.getElementById('main-btn');
      btn.disabled = true;
      btn.innerText = "Processing...";

      try {
        const payload = {
          email, phone, event: "MOTHERS_DAY",
          shippingMethod: state.shipping,
          productType: state.line
        };

        if (state.line === 'magnets') {
          const p = PACKAGES.find(x => x.id === state.pkg);
          payload.packSize = p.custom + p.premade;
          payload.premadeSelections = state.selectedPremades.map(id => PREMADES.find(x=>x.id===id).name);
          payload.mothersPackage = p.name;
        } else {
          payload.frameStyle = state.frameStyle;
          payload.frameSize = state.frameSize.m;
          payload.frameColor = state.frameColor;
          payload.includeMagnets = true;
        }

        const res = await fetch("/api/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if(!res.ok) throw new Error("Order error");
        const { orderId } = await res.json();

        // Convert base64 to blob and upload
        btn.innerText = "Uploading photos...";
        for(let i=0; i<state.photos.length; i++) {
          const r = await fetch(state.photos[i]);
          const blob = await r.blob();
          const fd = new FormData();
          fd.append("file", blob, `photo-${i}.jpg`);
          await fetch(`/api/upload?orderId=${orderId}`, { method: "POST", body: fd });
        }

        btn.innerText = "Redirecting...";
        const ck = await fetch("/api/checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ orderId, email, country: state.shipping }) });
        const { checkoutUrl } = await ck.json();
        window.location.href = checkoutUrl;

      } catch(e) {
        alert("Something went wrong. Please try again.");
        btn.disabled = false;
        render();
      }
    }

    render();
  </script>
</body>
</html>
