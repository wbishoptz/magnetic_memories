<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Event | Manual Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

  <div class="max-w-md w-full space-y-8">
    
    <div class="text-center">
      <h1 class="text-3xl font-bold text-emerald-400">Event Mode</h1>
      <p class="text-slate-400">Manual Entry (Paid In-Person)</p>
    </div>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
      <label class="block text-sm font-bold uppercase tracking-wider text-slate-400 mb-2">Raffle Ticket #</label>
      <input type="text" id="raffle" placeholder="e.g. 505" class="w-full text-3xl font-mono font-bold bg-slate-900 border border-slate-600 rounded-lg p-4 text-center focus:ring-2 focus:ring-emerald-500 outline-none" />
    </div>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
      <label class="block text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Photos (<span id="count">0</span>)</label>
      
      <div id="preview-grid" class="grid grid-cols-3 gap-2 mb-4"></div>

      <button onclick="document.getElementById('files').click()" class="w-full py-4 border-2 border-dashed border-slate-600 rounded-lg text-slate-400 hover:border-emerald-500 hover:text-emerald-500 transition-colors flex flex-col items-center justify-center gap-2">
        <i data-lucide="camera" class="w-6 h-6"></i>
        <span>Take / Select Photos</span>
      </button>
      <input type="file" id="files" multiple accept="image/*" class="hidden" />
    </div>

    <button id="submit-btn" onclick="submitManualOrder()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xl py-4 rounded-xl shadow-lg shadow-emerald-900/20 transition-all flex items-center justify-center gap-2">
      Confirm & Upload <i data-lucide="check-circle" class="w-6 h-6"></i>
    </button>

    <div id="status" class="text-center text-sm font-mono hidden"></div>

  </div>

  <script>
    lucide.createIcons();
    let selectedFiles = [];

    document.getElementById('files').addEventListener('change', (e) => {
      const newFiles = Array.from(e.target.files);
      selectedFiles = [...selectedFiles, ...newFiles];
      renderPreviews();
    });

    function renderPreviews() {
      const grid = document.getElementById('preview-grid');
      document.getElementById('count').innerText = selectedFiles.length;
      grid.innerHTML = selectedFiles.map((f, i) => `
        <div class="relative aspect-square bg-slate-900 rounded-lg overflow-hidden border border-slate-600">
          <img src="${URL.createObjectURL(f)}" class="w-full h-full object-cover opacity-80">
          <button onclick="removeFile(${i})" class="absolute top-0 right-0 bg-red-500 text-white p-1"><i data-lucide="x" class="w-3 h-3"></i></button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    window.removeFile = (i) => {
      selectedFiles.splice(i, 1);
      renderPreviews();
    };

    async function submitManualOrder() {
      const raffle = document.getElementById('raffle').value.trim();
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status');

      if (!raffle) return alert("Enter Raffle Ticket Number");
      if (selectedFiles.length === 0) return alert("Select at least 1 photo");

      btn.disabled = true;
      btn.innerHTML = "Creating Order...";
      status.classList.remove('hidden');

      try {
        // 1. Create Paid Order
        const res = await fetch("/api/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            event: "MANUAL",
            raffleNumber: raffle,
            packSize: selectedFiles.length, // Dynamic pack size
            email: `raffle-${raffle}@event.local`, // Fake email for system
            phone: "00000000",
            status: "paid" // Instant paid status
          })
        });

        if (!res.ok) throw new Error("Order creation failed");
        const { orderId } = await res.json();

        // 2. Upload Photos
        btn.innerHTML = `Uploading 0/${selectedFiles.length}...`;
        
        for (let i = 0; i < selectedFiles.length; i++) {
          const formData = new FormData();
          formData.append("file", selectedFiles[i]);
          
          // Pass the desired filename explicitly in the query string
          const fileName = `Ticket-${raffle}-${i+1}.jpg`; 
          
          await fetch(`/api/upload?orderId=${orderId}&filename=${encodeURIComponent(fileName)}`, {
            method: "POST",
            body: formData
          });
          
          btn.innerHTML = `Uploading ${i+1}/${selectedFiles.length}...`;
        }

        // 3. Reset
        alert(`Order Saved!\nTicket: ${raffle}\nPhotos: ${selectedFiles.length}`);
        location.reload();

      } catch (e) {
        alert("Error: " + e.message);
        btn.disabled = false;
        btn.innerText = "Try Again";
      }
    }
  </script>
</body>
</html>
