<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event | Manual Upload</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#59c9a5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <script src="/pwa.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

  <div class="max-w-md w-full space-y-6">

    <div class="text-center">
      <h1 class="text-3xl font-bold text-emerald-400">Event Mode</h1>
      <p class="text-slate-400">Manual Entry (Paid In-Person)</p>
    </div>

    <!-- Event selector -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
      <label class="block text-sm font-bold uppercase tracking-wider text-slate-400 mb-2">Event</label>
      <select id="event-select" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-lg font-semibold focus:ring-2 focus:ring-emerald-500 outline-none">
        <option value="">Loading events…</option>
      </select>
      <p id="event-help" class="text-xs text-slate-500 mt-2"></p>
    </div>

    <!-- Raffle number dropdown -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
      <div class="flex items-center justify-between mb-2">
        <label class="block text-sm font-bold uppercase tracking-wider text-slate-400">Raffle Ticket #</label>
        <span id="free-count" class="text-xs text-slate-500"></span>
      </div>
      <select id="raffle" disabled class="w-full text-2xl font-mono font-bold bg-slate-900 border border-slate-600 rounded-lg p-4 text-center focus:ring-2 focus:ring-emerald-500 outline-none disabled:opacity-50">
        <option value="">Select an event first</option>
      </select>
      <p id="taken-notice" class="text-sm font-bold text-amber-400 mt-2 hidden"></p>
      <p class="text-xs text-slate-500 mt-2">Only un-used numbers are shown. Once saved, a number disappears from this list.</p>
    </div>

    <!-- Photos -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
      <label class="block text-sm font-bold uppercase tracking-wider text-slate-400 mb-1">Photos (<span id="count">0</span><span id="limit-label"></span>)</label>
      <p id="limit-hint" class="text-xs text-slate-500 mb-4">Tap a photo to view it larger.</p>
      <div id="preview-grid" class="grid grid-cols-3 gap-2 mb-4"></div>
      <button id="add-photo-btn" onclick="document.getElementById('files').click()" class="w-full py-4 border-2 border-dashed border-slate-600 rounded-lg text-slate-400 hover:border-emerald-500 hover:text-emerald-500 transition-colors flex flex-col items-center justify-center gap-2 disabled:opacity-40">
        <i data-lucide="camera" class="w-6 h-6"></i>
        <span>Take / Select Photos</span>
      </button>
      <input type="file" id="files" multiple accept="image/*" class="hidden" />
    </div>

    <button id="submit-btn" onclick="submitManualOrder()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xl py-4 rounded-xl shadow-lg shadow-emerald-900/20 transition-all flex items-center justify-center gap-2 disabled:opacity-40">
      Confirm & Upload <i data-lucide="check-circle" class="w-6 h-6"></i>
    </button>

    <div id="status" class="text-center text-sm font-mono hidden"></div>

    <p class="text-center text-xs text-slate-600">Manage events in the <a href="/admin.html" class="underline hover:text-slate-400">Admin → Events</a> tab.</p>
  </div>

  <!-- Enlarge / decide modal -->
  <div id="photo-modal" class="fixed inset-0 z-50 bg-black/90 flex-col items-center justify-center p-6" style="display:none;">
    <img id="photo-modal-img" src="" class="max-w-full max-h-[68vh] rounded-lg object-contain mb-4" />
    <p class="text-slate-400 text-sm mb-5">Photo <span id="photo-modal-pos"></span></p>
    <div class="flex gap-4">
      <button onclick="removeFromPreview()" class="px-6 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-bold flex items-center gap-2"><i data-lucide="trash-2" class="w-5 h-5"></i> Remove</button>
      <button onclick="closePreview()" class="px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold flex items-center gap-2"><i data-lucide="check" class="w-5 h-5"></i> Keep</button>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let selectedFiles = [];
    let events = [];
    let currentEvent = null;
    let usedNumbers = new Set();

    // Numbers this page saved recently: eventId -> Map(number -> savedAt ms). Without the
    // events database the server's used list comes from KV, which can lag up to ~60s, so a
    // refresh could briefly offer a number we just used. Keep them hidden for 120s.
    const RECENT_USED_MS = 120000;
    const recentlyUsed = new Map();
    function rememberUsed(eventId, n) {
      if (!recentlyUsed.has(eventId)) recentlyUsed.set(eventId, new Map());
      recentlyUsed.get(eventId).set(Number(n), Date.now());
    }
    // Adds this page's recent (<120s) saves for the event to `set`; forgets older ones.
    function withRecentlyUsed(eventId, set) {
      const mine = recentlyUsed.get(eventId);
      if (!mine) return set;
      const cutoff = Date.now() - RECENT_USED_MS;
      for (const [n, t] of mine) {
        if (t < cutoff) mine.delete(n); else set.add(n);
      }
      return set;
    }

    function escHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const eventSelect = document.getElementById('event-select');
    const raffleSelect = document.getElementById('raffle');
    const eventHelp = document.getElementById('event-help');
    const freeCount = document.getElementById('free-count');

    // ── Load events ───────────────────────────────────────────────
    async function loadEvents() {
      try {
        const res = await fetch('/api/events');
        const data = await res.json();
        events = (data.events || []).filter(e => e.active);
        if (events.length === 0) {
          eventSelect.innerHTML = '<option value="">No active events</option>';
          eventHelp.textContent = 'No active event found. Create one in Admin → Events.';
          return;
        }
        eventSelect.innerHTML = events.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        await selectEvent(events[0].id);
      } catch (e) {
        eventSelect.innerHTML = '<option value="">Error loading</option>';
        eventHelp.textContent = 'Could not load events. Check connection.';
      }
    }

    eventSelect.addEventListener('change', () => selectEvent(eventSelect.value));

    async function selectEvent(id) {
      currentEvent = events.find(e => e.id === id) || null;
      if (!currentEvent) return;
      raffleSelect.disabled = true;
      raffleSelect.innerHTML = '<option value="">Loading numbers…</option>';
      try {
        const res = await fetch(`/api/events?id=${encodeURIComponent(id)}`);
        const data = await res.json();
        usedNumbers = withRecentlyUsed(id, new Set((data.used || []).map(Number)));
        currentEvent = data.event || currentEvent;
        populateNumbers();
        renderPreviews(); // refresh the per-ticket limit label
      } catch (e) {
        raffleSelect.innerHTML = '<option value="">Error loading numbers</option>';
      }
    }

    function populateNumbers() {
      const { rangeStart, rangeEnd } = currentEvent;
      const keep = raffleSelect.value; // keep the current pick if it's still free
      // A number held by our own unfinished (resumable) upload stays pickable,
      // so a refresh never breaks "Retry Upload".
      const mine = (activeUpload && activeUpload.eventId === currentEvent.id) ? Number(activeUpload.raffle) : null;
      const free = [];
      for (let n = rangeStart; n <= rangeEnd; n++) {
        if (!usedNumbers.has(n) || n === mine) free.push(n);
      }
      eventHelp.textContent = `Range ${rangeStart}–${rangeEnd} · ${usedNumbers.size} used`;
      freeCount.textContent = `${free.length} free`;
      if (free.length === 0) {
        raffleSelect.innerHTML = '<option value="">All numbers used 🎉</option>';
        raffleSelect.disabled = true;
        return;
      }
      raffleSelect.innerHTML = '<option value="">— pick a number —</option>' +
        free.map(n => `<option value="${n}">#${n}</option>`).join('');
      if (keep && free.includes(Number(keep))) raffleSelect.value = keep;
      raffleSelect.disabled = false;
    }

    // ── Live refresh of used numbers ──────────────────────────────
    // Guests self-uploading (and other staff phones) share this event's numbers,
    // so re-check every 15s while visible, when the page comes back into view,
    // and right before creating an order.
    let submitting = false;   // true while Confirm & Upload is running
    let refreshSeq = 0;       // only the newest refresh result is applied
    let takenTimer = null;

    function showTakenNotice(n) {
      const el = document.getElementById('taken-notice');
      el.textContent = `#${n} was just taken — pick another.`;
      el.classList.remove('hidden');
      clearTimeout(takenTimer);
      takenTimer = setTimeout(() => el.classList.add('hidden'), 8000);
    }

    // Returns true if the list was refreshed, false if skipped/failed.
    async function refreshUsedNumbers(force = false) {
      if (!currentEvent) return false;
      if (!force && (submitting || document.hidden)) return false;
      const id = currentEvent.id;
      const seq = ++refreshSeq;
      try {
        const res = await fetch(`/api/events?id=${encodeURIComponent(id)}`, { cache: 'no-store' });
        if (!res.ok) return false;
        const data = await res.json();
        // Drop stale results: event switched, a newer refresh started, or an upload began meanwhile
        if (seq !== refreshSeq || !currentEvent || currentEvent.id !== id) return false;
        if (!force && submitting) return false;
        const prevLimit = currentEvent.perTicketLimit;
        // Union in numbers this page just saved — the server list may not show them yet (KV lag)
        usedNumbers = withRecentlyUsed(id, new Set((data.used || []).map(Number)));
        if (data.event) currentEvent = data.event;
        const prev = raffleSelect.value;
        populateNumbers();
        if (prev && raffleSelect.value !== prev) showTakenNotice(prev);
        if (currentEvent.perTicketLimit !== prevLimit) renderPreviews();
        return true;
      } catch (e) {
        return false; // offline / weak signal — the server still blocks duplicates
      }
    }

    setInterval(() => { refreshUsedNumbers(); }, 15000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshUsedNumbers();
    });

    // ── Photos ────────────────────────────────────────────────────
    function ticketLimit() {
      const n = Number(currentEvent && currentEvent.perTicketLimit);
      return n > 0 ? n : Infinity;
    }

    document.getElementById('files').addEventListener('change', (e) => {
      const lim = ticketLimit();
      const incoming = Array.from(e.target.files);
      let blocked = false;
      for (const f of incoming) {
        if (selectedFiles.length >= lim) { blocked = true; break; }
        selectedFiles.push(f);
      }
      if (blocked) alert(`This ticket allows up to ${lim} photo${lim > 1 ? 's' : ''}.`);
      e.target.value = '';
      renderPreviews();
    });

    function renderPreviews() {
      const grid = document.getElementById('preview-grid');
      const lim = ticketLimit();
      document.getElementById('count').innerText = selectedFiles.length;
      document.getElementById('limit-label').innerText = lim < Infinity ? '/' + lim : '';
      document.getElementById('limit-hint').innerText = lim < Infinity
        ? `Up to ${lim} photo${lim > 1 ? 's' : ''} per ticket · tap a photo to view it larger.`
        : 'Tap a photo to view it larger.';
      grid.innerHTML = selectedFiles.map((f, i) => `
        <div class="relative aspect-square bg-slate-900 rounded-lg overflow-hidden border border-slate-600">
          <img src="${URL.createObjectURL(f)}" onclick="openPreview(${i})" class="w-full h-full object-cover opacity-80 cursor-pointer">
          <button onclick="removeFile(${i})" class="absolute top-0 right-0 bg-red-500 text-white p-1 z-10"><i data-lucide="x" class="w-3 h-3"></i></button>
        </div>
      `).join('');
      const addBtn = document.getElementById('add-photo-btn');
      const atLimit = selectedFiles.length >= lim;
      addBtn.disabled = atLimit;
      addBtn.style.display = atLimit ? 'none' : '';
      lucide.createIcons();
    }

    window.removeFile = (i) => { selectedFiles.splice(i, 1); renderPreviews(); };

    // ── Tap-to-enlarge preview ────────────────────────────────────
    let previewIdx = null, previewUrl = null;
    window.openPreview = (i) => {
      const f = selectedFiles[i];
      if (!f) return;
      previewIdx = i;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(f);
      document.getElementById('photo-modal-img').src = previewUrl;
      document.getElementById('photo-modal-pos').innerText = `${i + 1} of ${selectedFiles.length}`;
      document.getElementById('photo-modal').style.display = 'flex';
      lucide.createIcons();
    };
    window.closePreview = () => {
      document.getElementById('photo-modal').style.display = 'none';
      if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
      previewIdx = null;
    };
    window.removeFromPreview = () => {
      if (previewIdx != null) removeFile(previewIdx);
      closePreview();
    };

    // ── Submit (with upload verification + auto-retry) ─────────────
    // Tracks an in-progress upload so a weak-signal failure can be retried
    // without re-uploading photos that already went through.
    let activeUpload = null; // { orderId, raffle, count, done: boolean[] }

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    // Upload one photo, retrying on failure. Returns true only if the SERVER
    // confirmed it was saved (HTTP 200 + a key in the response).
    async function uploadWithRetry(orderId, file, fileName, attempts = 4) {
      for (let a = 1; a <= attempts; a++) {
        try {
          const form = new FormData();
          form.append('file', file, fileName);
          const r = await fetch(`/api/upload?orderId=${orderId}&filename=${encodeURIComponent(fileName)}`, { method: 'POST', body: form });
          if (r.ok) {
            const j = await r.json().catch(() => ({}));
            if (j && (j.ok || j.key)) return true;
          }
        } catch (e) { /* network blip — fall through to retry */ }
        if (a < attempts) await sleep(700 * a); // backoff: 0.7s, 1.4s, 2.1s
      }
      return false;
    }

    async function submitManualOrder() {
      const raffle = raffleSelect.value;
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status');

      if (!currentEvent) return alert('Select an event first.');
      if (!raffle) return alert('Pick a raffle ticket number.');
      if (selectedFiles.length === 0) return alert('Select at least 1 photo.');

      btn.disabled = true;
      submitting = true;
      status.classList.remove('hidden');
      status.innerHTML = '';
      const uploadEventId = currentEvent.id; // the event this ticket belongs to, even if the dropdown changes mid-upload

      try {
        let orderId, done;

        // Resume a previous attempt for the same event + ticket + same photos, or start fresh
        if (activeUpload && activeUpload.eventId === currentEvent.id && activeUpload.raffle === raffle && activeUpload.count === selectedFiles.length) {
          orderId = activeUpload.orderId;
          done = activeUpload.done;
          btn.innerHTML = 'Retrying…';
        } else {
          // Last-second check: a guest (or another phone) may have just taken this number
          btn.innerHTML = 'Checking number...';
          await refreshUsedNumbers(true);
          if (raffleSelect.value !== raffle) {
            status.classList.add('hidden');
            btn.disabled = false;
            btn.innerHTML = 'Confirm & Upload';
            return;
          }
          btn.innerHTML = 'Creating Order...';
          const res = await fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event: 'MANUAL',
              eventId: currentEvent.id,
              raffleNumber: raffle,
              packSize: selectedFiles.length,
              email: `raffle-${currentEvent.id}-${raffle}@event.local`,
              phone: '00000000',
              status: 'paid'
            })
          });
          if (res.status === 409) {
            const d = await res.json().catch(() => ({}));
            alert(d.error || 'That number was just taken. Refreshing list.');
            activeUpload = null;
            await selectEvent(currentEvent.id);
            btn.disabled = false;
            btn.innerHTML = 'Confirm & Upload';
            return;
          }
          if (!res.ok) {
            // Show the server's message when there is one (e.g. 503 "Could not reserve the number - please try again.")
            const d = await res.json().catch(() => ({}));
            const serverMsg = d && typeof d.error === 'string' ? d.error.trim() : '';
            const err = new Error(serverMsg || 'Order creation failed');
            err.fromServer = !!serverMsg;
            throw err;
          }
          orderId = (await res.json()).orderId;
          rememberUsed(uploadEventId, raffle); // the number is taken on the server from here on
          done = new Array(selectedFiles.length).fill(false);
          activeUpload = { orderId, eventId: currentEvent.id, raffle, count: selectedFiles.length, done };
        }

        // Upload every photo that hasn't been confirmed yet
        let failed = 0;
        for (let i = 0; i < selectedFiles.length; i++) {
          if (done[i]) continue;
          btn.innerHTML = `Uploading ${i + 1}/${selectedFiles.length}…`;
          const ok = await uploadWithRetry(orderId, selectedFiles[i], `Ticket-${raffle}-${i + 1}.jpg`);
          if (ok) done[i] = true; else failed++;
        }

        if (failed > 0) {
          // Keep the photos + order so they can simply tap again to retry the missing ones
          status.innerHTML = `<span class="text-amber-400">⚠️ ${failed} photo(s) didn't upload (weak signal). Tap "Retry Upload" to try just the missing ${failed}.</span>`;
          btn.disabled = false;
          btn.innerHTML = `🔁 Retry Upload (${failed} left)`;
          return;
        }

        // All photos confirmed saved — now it's safe to finish
        activeUpload = null;
        rememberUsed(uploadEventId, raffle);
        if (currentEvent && currentEvent.id === uploadEventId) usedNumbers.add(Number(raffle));
        selectedFiles = [];
        renderPreviews();
        populateNumbers();
        status.innerHTML = `<span class="text-emerald-400">✅ Saved ticket #${raffle} — all ${done.length} photo(s) confirmed.</span>`;
        btn.disabled = false;
        btn.innerHTML = 'Confirm & Upload';

      } catch (e) {
        const text = e.fromServer ? e.message : `${e.message}. Tap to try again.`;
        status.innerHTML = `<span class="text-amber-400">⚠️ ${escHtml(text)}</span>`;
        btn.disabled = false;
        btn.innerText = 'Try Again';
      } finally {
        submitting = false;
      }
    }

    loadEvents();
  </script>
</body>
</html>
