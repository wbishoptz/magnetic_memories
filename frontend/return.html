<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Magnetic Memories – Order status</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="/styles.css" />

    <style>
      /* --- Local styles just for this page (progress bar + layout tweaks) --- */

      body {
        background: #030712;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 0;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: radial-gradient(circle at top, #111827, #020617);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
        padding: 32px;
        max-width: 720px;
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .subtitle {
        margin: 0 0 24px;
        color: #9ca3af;
        font-size: 14px;
      }

      .panel {
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(15, 23, 42, 0.7);
        padding: 20px 20px 18px;
      }

      .panel-header {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9ca3af;
        margin-bottom: 6px;
      }

      .order-id {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 13px;
        color: #e5e7eb;
        user-select: all;
        word-break: break-all;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
      }

      .status-label {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9ca3af;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: #111827;
        border: 1px solid #4b5563;
        color: #e5e7eb;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #6b7280;
      }

      .status-pill.paid .status-dot {
        background: #4ade80;
      }

      .status-pill.printing .status-dot {
        background: #22d3ee;
      }

      .status-pill.shipped .status-dot {
        background: #f97316;
      }

      .status-pill.complete .status-dot {
        background: #a855f7;
      }

      .status-pill.checkout_created .status-dot {
        background: #eab308;
      }

      .status-text {
        margin-top: 14px;
        font-size: 14px;
        color: #d1d5db;
      }

      .meta-row {
        margin-top: 14px;
        font-size: 13px;
        color: #9ca3af;
      }

      .meta-row span {
        color: #e5e7eb;
      }

      .hidden {
        display: none !important;
      }

      /* --- Progress steps --- */

      .progress-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 20px auto 18px;
        gap: 10px;
        max-width: 640px;
      }

      .step {
        text-align: center;
        color: #6b7280;
        font-size: 11px;
      }

      .circle {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 2px solid #374151;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 4px;
        background: #020617;
        font-size: 13px;
      }

      .line {
        flex: 1;
        height: 2px;
        background: #374151;
        border-radius: 999px;
      }

      .step.active .circle {
        background: #4ade80;
        color: #020617;
        border-color: #4ade80;
        box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.4),
          0 0 20px rgba(34, 197, 94, 0.4);
      }

      .step.active span {
        color: #e5e7eb;
        font-weight: 600;
      }

      .line.active {
        background: linear-gradient(to right, #4ade80, #22c55e);
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
      }

      /* --- Loading / error states --- */

      .loading-text {
        font-size: 14px;
        color: #9ca3af;
      }

      .error-text {
        font-size: 14px;
        color: #fecaca;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border-radius: 999px;
        border: 2px solid #4b5563;
        border-top-color: #38bdf8;
        animation: spin 0.7s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <main class="card">
        <h1>Thanks!</h1>
        <p class="subtitle">
          We've received your order. If you just paid, this page will update
          once the payment is confirmed.
        </p>

        <div id="loadingBlock" class="panel">
          <div style="display: flex; align-items: center; gap: 10px">
            <div class="spinner"></div>
            <span class="loading-text">Loading your order…</span>
          </div>
        </div>

        <section id="orderBlock" class="panel hidden">
          <div class="panel-header">Order</div>
          <div id="orderId" class="order-id">—</div>

          <div id="progress-steps" class="progress-container">
            <div class="step" id="step-paid">
              <div class="circle">1</div>
              <span>Paid</span>
            </div>

            <div class="line"></div>

            <div class="step" id="step-printing">
              <div class="circle">2</div>
              <span>Printing</span>
            </div>

            <div class="line"></div>

            <div class="step" id="step-shipped">
              <div class="circle">3</div>
              <span>Shipped</span>
            </div>

            <div class="line"></div>

            <div class="step" id="step-complete">
              <div class="circle">4</div>
              <span>Complete</span>
            </div>
          </div>

          <div id="orderImages" style="display:flex; gap:8px; overflow-x:auto; margin-top:20px; padding-bottom:10px;">
            </div>

          <div class="status-row">
            <div class="status-label">Status</div>
            <div id="statusPill" class="status-pill">
              <span class="status-dot"></span>
              <span id="statusText">—</span>
            </div>
          </div>

          <div id="statusDescription" class="status-text">
            We’re processing your order.
          </div>

          <div class="meta-row">
            Pack: <span id="packMeta">—</span> &nbsp;·&nbsp; Total:
            <span id="priceMeta">—</span>
          </div>
          <div class="meta-row">
            Created: <span id="createdMeta">—</span>
          </div>
        </section>

        <section id="errorBlock" class="panel hidden">
          <div class="error-text" id="errorMessage"></div>
        </section>
      </main>
    </div>

    <script>
      // ------- Helper: read query params -------
      const url = new URL(window.location.href);
      const orderId = url.searchParams.get("orderId");
      const loadingBlock = document.getElementById("loadingBlock");
      const orderBlock = document.getElementById("orderBlock");
      const errorBlock = document.getElementById("errorBlock");
      const errorMessage = document.getElementById("errorMessage");

      const orderIdEl = document.getElementById("orderId");
      const statusPill = document.getElementById("statusPill");
      const statusTextEl = document.getElementById("statusText");
      const statusDescription = document.getElementById("statusDescription");
      const packMeta = document.getElementById("packMeta");
      const priceMeta = document.getElementById("priceMeta");
      const createdMeta = document.getElementById("createdMeta");
      const imgContainer = document.getElementById("orderImages");

      if (!orderId) {
        loadingBlock.classList.add("hidden");
        errorBlock.classList.remove("hidden");
        errorMessage.textContent =
          "We couldn't find an order ID in the link. Please open the link from your confirmation email again.";
      } else {
        orderIdEl.textContent = orderId;
        startPolling(orderId);
      }

      // ------- Map internal statuses to user-friendly text -------

      function formatStatus(status) {
        switch (status) {
          case "checkout_created":
            return "Awaiting payment confirmation";
          case "paid":
            return "Paid";
          case "printing":
            return "Printing";
          case "shipped":
            return "Shipped";
          case "complete":
            return "Complete";
          default:
            return status || "Unknown";
        }
      }

      function statusMessage(status) {
        switch (status) {
          case "checkout_created":
            return "We've created your checkout session and are waiting for Stripe to confirm your payment.";
          case "paid":
            return "We've confirmed your payment with Stripe. We'll start preparing your magnets shortly.";
          case "printing":
            return "We're currently printing your magnets and getting them ready for shipment.";
          case "shipped":
            return "Your magnets have been shipped. They'll be with you very soon!";
          case "complete":
            return "Your order is complete. Thanks again for choosing Magnetic Memories!";
          default:
            return "We're processing your order.";
        }
      }

      // ------- Progress bar logic -------

      function updateProgress(status) {
        const steps = ["paid", "printing", "shipped", "complete"];
        const lines = document.querySelectorAll(".line");

        steps.forEach((s, index) => {
          const stepEl = document.getElementById(`step-${s}`);
          if (!stepEl) return;

          if (steps.indexOf(status) >= index) {
            stepEl.classList.add("active");
            if (index > 0 && lines[index - 1]) {
              lines[index - 1].classList.add("active");
            }
          } else {
            stepEl.classList.remove("active");
            if (index > 0 && lines[index - 1]) {
              lines[index - 1].classList.remove("active");
            }
          }
        });
      }

      // ------- Poll API for order status -------

      function startPolling(orderId) {
        let attempts = 0;
        const maxAttempts = 60; // ~4 minutes at 4s interval

        const poll = async () => {
          attempts++;

          try {
            const res = await fetch(
              `/api/order?orderId=${encodeURIComponent(orderId)}`
            );

            if (!res.ok) {
              throw new Error("Order lookup failed: " + res.status);
            }

            const order = await res.json();

            loadingBlock.classList.add("hidden");
            errorBlock.classList.add("hidden");
            orderBlock.classList.remove("hidden");

            // RENDER IMAGES (New)
            if (order.images && order.images.length > 0 && imgContainer.innerHTML === "") {
              order.images.forEach(img => {
                const el = document.createElement("img");
                // Use the new public-image loader
                el.src = `/api/public-image?orderId=${encodeURIComponent(orderId)}&key=${encodeURIComponent(img.key)}`;
                el.style.width = "60px";
                el.style.height = "60px";
                el.style.borderRadius = "8px";
                el.style.objectFit = "cover";
                el.style.border = "1px solid #374151";
                el.alt = "Your magnet preview";
                imgContainer.appendChild(el);
              });
            }

            const status = order.status || "checkout_created";

            // Update pill
            statusPill.className = "status-pill " + status;
            statusTextEl.textContent = formatStatus(status);
            statusDescription.textContent = statusMessage(status);

            // Meta info
            packMeta.textContent = order.packSize
              ? `${order.packSize} magnets`
              : "—";
            if (typeof order.price === "number") {
              priceMeta.textContent = "£" + order.price.toFixed(2);
            } else if (order.price) {
              priceMeta.textContent = "£" + order.price;
            } else {
              priceMeta.textContent = "—";
            }
            createdMeta.textContent = order.createdAt || "—";

            // Progress bar
            updateProgress(status);

            // Stop polling if in final state
            if (status === "complete" || attempts >= maxAttempts) {
              clearInterval(intervalId);
            }
          } catch (err) {
            console.error("Error fetching order:", err);
            if (attempts === 1) {
              loadingBlock.classList.add("hidden");
              errorBlock.classList.remove("hidden");
              errorMessage.textContent =
                "We couldn't load your order right now. Please refresh the page in a moment.";
            }
          }
        };

        // first immediate call + interval
        poll();
        var intervalId = setInterval(poll, 4000);
      }
    </script>
  </body>
</html>
