<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magnetic Memories | Choose Your Product</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
          colors: {
            background: "hsl(15 33% 97%)", 
            primary: "hsl(350 80% 55%)",
            muted: "hsl(15 20% 92%)"
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
          },
          keyframes: {
            fadeIn: { from: { opacity: 0, transform: 'translateY(10px)' }, to: { opacity: 1, transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-background text-slate-900">

  <div class="max-w-md w-full animate-fade-in text-center">
    
    <img src="./logo.png" alt="Magnetic Memories" class="w-64 mx-auto mb-8 object-contain" />

    <h1 class="font-serif text-3xl font-bold mb-2">Welcome</h1>
    <p class="text-slate-500 mb-10">Select a product to get started</p>

    <div class="space-y-4">
      
      <a href="/magnets" class="block group relative overflow-hidden rounded-2xl bg-white border-2 border-transparent hover:border-primary/30 shadow-sm transition-all duration-300">
        <div class="flex items-center p-5 gap-5">
          <div class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
             <i data-lucide="image" class="w-8 h-8 text-blue-500"></i>
          </div>
          <div class="text-left flex-1">
            <h3 class="font-serif text-xl font-bold text-slate-900">Photo Magnets</h3>
            <p class="text-xs text-slate-500 mt-1">Turn your photos into fridge magnets</p>
          </div>
          <div class="text-slate-300 group-hover:text-primary transition-colors">
            <i data-lucide="arrow-right" class="w-6 h-6"></i>
          </div>
        </div>
      </a>

      <a href="/frames" class="block group relative overflow-hidden rounded-2xl bg-white border-2 border-transparent hover:border-primary/30 shadow-sm transition-all duration-300">
        <div class="flex items-center p-5 gap-5">
          <div class="w-16 h-16 rounded-full bg-rose-50 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
             <i data-lucide="frame" class="w-8 h-8 text-primary"></i>
          </div>
          <div class="text-left flex-1">
            <h3 class="font-serif text-xl font-bold text-slate-900">Frames</h3>
            <p class="text-xs text-slate-500 mt-1">Premium frames with magnetic slots</p>
          </div>
          <div class="text-slate-300 group-hover:text-primary transition-colors">
            <i data-lucide="arrow-right" class="w-6 h-6"></i>
          </div>
        </div>
      </a>

    </div>

    <div class="mt-12 text-xs text-slate-400">
      &copy; Magnetic Memories
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
