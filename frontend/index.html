<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magnetic Memories | Choose Your Product</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <meta name="description" content="Custom photo magnets, frames, and keyrings. Turn your favourite photos into lasting memories." />
  <meta property="og:title" content="Magnetic Memories" />
  <meta property="og:description" content="Custom photo magnets, frames, and keyrings. Turn your favourite photos into lasting memories." />
  <meta property="og:image" content="https://magnetic-memories.pages.dev/logo.png" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
          colors: {
            background: "hsl(15 33% 97%)", 
            primary: "hsl(350 80% 55%)",
            muted: "hsl(15 20% 92%)"
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: theme('colors.background');
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="antialiased text-slate-800 min-h-screen">

  <main class="container mx-auto px-4 py-8 max-w-2xl">
    
    <div class="text-center mb-10 mt-2">
      <img src="./logo.png" alt="Magnetic Memories" class="mx-auto h-36 sm:h-40 w-auto object-contain" />
    </div>

    <div class="space-y-4">
      
      <a href="/frames" class="block group relative overflow-hidden rounded-2xl bg-white border-2 border-transparent hover:border-primary/30 shadow-sm transition-all duration-300">
        <div class="flex items-center p-5 gap-5">
          <div class="w-16 h-16 rounded-full bg-rose-50 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
            <i data-lucide="frame" class="w-8 h-8 text-rose-500"></i>
          </div>
          <div class="text-left flex-1">
            <h3 class="font-serif text-xl font-bold text-slate-900">Photo Frames</h3>
            <p class="text-xs text-slate-500 mt-1">Premium frames with magnetic slots</p>
          </div>
          <div class="text-slate-300 group-hover:text-primary transition-colors">
            <i data-lucide="arrow-right" class="w-6 h-6"></i>
          </div>
        </div>
      </a>

      <a href="/magnets" class="block group relative overflow-hidden rounded-2xl bg-white border-2 border-transparent hover:border-primary/30 shadow-sm transition-all duration-300">
        <div class="flex items-center p-5 gap-5">
          <div class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
             <i data-lucide="image" class="w-8 h-8 text-blue-500"></i>
          </div>
          <div class="text-left flex-1">
            <h3 class="font-serif text-xl font-bold text-slate-900">Photo Magnets</h3>
            <p class="text-xs text-slate-500 mt-1">Turn your photos into fridge magnets</p>
          </div>
          <div class="text-slate-300 group-hover:text-primary transition-colors">
            <i data-lucide="arrow-right" class="w-6 h-6"></i>
          </div>
        </div>
      </a>

      <a href="/keyrings" class="block group relative overflow-hidden rounded-2xl bg-white border-2 border-transparent hover:border-primary/30 shadow-sm transition-all duration-300">
        <div class="flex items-center p-5 gap-5">
          <div class="w-16 h-16 rounded-full bg-amber-50 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
             <i data-lucide="key" class="w-8 h-8 text-amber-500"></i>
          </div>
          <div class="text-left flex-1">
            <h3 class="font-serif text-xl font-bold text-slate-900">Photo Keyrings</h3>
            <p class="text-xs text-slate-500 mt-1">Double-sided premium keyrings with a faux leather strap</p>
          </div>
          <div class="text-slate-300 group-hover:text-primary transition-colors">
            <i data-lucide="arrow-right" class="w-6 h-6"></i>
          </div>
        </div>
      </a>

    </div>

    <footer class="mt-12 text-center pb-8">
      <p class="text-xs text-slate-400">
        &copy; 2026 Magnetic Memories. Printed with love.
      </p>
      <div class="mt-4 flex justify-center gap-4 text-xs text-slate-400">
        <a href="/legal.html" class="hover:text-slate-600 transition-colors">Privacy Policy</a>
        <span>&middot;</span>
        <a href="/legal.html" class="hover:text-slate-600 transition-colors">Terms of Service</a>
      </div>
    </footer>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
