<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magnetic Memories | Bonkers Bingo Night</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nunito', 'sans-serif'],
            display: ['Fredoka', 'sans-serif'],
          },
          colors: {
            border: "hsl(214.3 31.8% 91.4%)",
            input: "hsl(214.3 31.8% 91.4%)",
            background: "hsl(180 25% 97%)",
            foreground: "hsl(200 30% 15%)",
            primary: "hsl(175 60% 35%)", // Teal
            secondary: "hsl(330 80% 55%)", // Pink
            // Custom Bingo Colors
            "bingo-teal": "#1a9a8a",
            "bingo-pink": "#eb2f96",
            "bingo-yellow": "#f59e0b",
            "bingo-purple": "#8b5cf6",
            "bingo-orange": "#f97316",
          },
          animation: {
            'bounce-gentle': 'bounce-gentle 2s infinite',
            'wiggle': 'wiggle 1s ease-in-out infinite',
            'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            'bounce-gentle': { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } },
            'wiggle': { '0%, 100%': { transform: 'rotate(-3deg)' }, '50%': { transform: 'rotate(3deg)' } },
            'pulse-glow': { '0%, 100%': { boxShadow: '0 0 20px rgba(235, 47, 150, 0.4)' }, '50%': { boxShadow: '0 0 40px rgba(235, 47, 150, 0.6)' } },
            'float': { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #f0fdfa; color: #1e293b; }
    h1, h2, h3, .font-display { font-family: 'Fredoka', sans-serif; }
    
    .bg-gradient-party { background: linear-gradient(135deg, #1a9a8a, #8b5cf6); }
    .bg-gradient-hot { background: linear-gradient(135deg, #eb2f96, #f97316); }
    .text-gradient-party {
      background: linear-gradient(135deg, #1a9a8a, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .shadow-pink { box-shadow: 0 8px 30px -8px rgba(235, 47, 150, 0.4); }
    .shadow-bingo { box-shadow: 0 8px 30px -8px rgba(26, 154, 138, 0.4); }

    /* Modals */
    .modal-overlay { 
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
      z-index: 50; display: none; align-items: center; justify-content: center; 
    }
    .modal-content { 
      background: white; padding: 24px; border-radius: 24px; 
      width: 95%; max-width: 450px; display: flex; flex-direction: column; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .cropper-container { 
      height: 350px; width: 100%; 
      background: #f3f4f6; margin-bottom: 16px; border-radius: 12px; overflow: hidden; 
    }
    .cropper-container img { display: block; max-width: 100%; }
  </style>
</head>
<body class="min-h-screen pb-20 px-4 pt-6 max-w-md mx-auto selection:bg-pink-500 selection:text-white">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none -z-10">
      <div class="absolute top-4 left-2 animate-float" style="animation-duration: 4s;">
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-teal-500 to-teal-700 shadow-bingo flex items-center justify-center text-white font-bold text-2xl border-4 border-white/20 transform rotate-12">88</div>
      </div>
      <div class="absolute top-20 right-2 animate-float" style="animation-delay: 1s;">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-pink-500 to-pink-700 shadow-pink flex items-center justify-center text-white font-bold text-xl border-4 border-white/20 transform -rotate-12">22</div>
      </div>
    </div>

    <header class="text-center mb-8 relative z-10 mt-4">
      <div class="relative inline-block">
        <img src="./logo.png" alt="Magnetic Memories" class="w-64 mx-auto mb-2 object-contain" />
        <div class="absolute -right-2 -top-2 animate-wiggle">
          <i data-lucide="sparkles" class="w-6 h-6 text-yellow-400 fill-yellow-400"></i>
        </div>
      </div>
      <p class="text-gray-500 font-medium mt-1 bg-white/80 backdrop-blur-sm py-1 px-4 rounded-full inline-block border border-gray-200 shadow-sm">
        Bonkers Bingo Special Edition 🎱
      </p>
    </header>

    <section class="mb-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <div class="bg-pink-100 p-2 rounded-lg">
          <i data-lucide="ticket" class="w-5 h-5 text-pink-600"></i>
        </div>
        1. Choose your pack
      </h2>
      <div class="grid grid-cols-2 gap-3" id="pack-grid">
        </div>
    </section>

    <section class="mb-8 animate-in fade-in slide-in-from-bottom-4 duration-500 delay-100">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <div class="bg-purple-100 p-2 rounded-lg">
          <i data-lucide="camera" class="w-5 h-5 text-purple-600"></i>
        </div>
        2. Add your photos
      </h2>
      
      <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-200">
        <div class="grid grid-cols-3 gap-3" id="image-grid">
          </div>
        
        <input type="file" id="fileInput" multiple accept="image/*" class="hidden" />
        
        <div class="flex items-center justify-center gap-2 py-4">
          <span class="font-display text-2xl font-bold text-gray-400" id="counter-text">0/0</span>
          <span class="text-gray-400 text-sm">photos selected</span>
        </div>
      </div>
    </section>

    <section id="details-section" class="mb-8 hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <div class="bg-orange-100 p-2 rounded-lg">
          <i data-lucide="user" class="w-5 h-5 text-orange-600"></i>
        </div>
        3. Your details
      </h2>
      <div class="space-y-3">
        <div class="relative">
          <i data-lucide="phone" class="absolute left-3 top-3.5 w-5 h-5 text-gray-400"></i>
          <input type="tel" id="phone" placeholder="Mobile number" class="w-full pl-10 h-12 rounded-xl border border-gray-200 bg-white px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all shadow-sm" />
        </div>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-3 top-3.5 w-5 h-5 text-gray-400"></i>
          <input type="email" id="email" placeholder="Email address" class="w-full pl-10 h-12 rounded-xl border border-gray-200 bg-white px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all shadow-sm" />
        </div>
      </div>
    </section>

    <button id="submit-btn" disabled class="w-full py-5 rounded-2xl font-display text-xl font-bold transition-all duration-300 bg-gray-200 text-gray-400 cursor-not-allowed shadow-lg relative overflow-hidden group mb-8">
      <span class="relative z-10 flex items-center justify-center gap-2" id="submit-text">
        Select photos to start
      </span>
    </button>

    <footer class="text-center text-sm text-gray-400 pb-8">
      <p>Small magnets, big memories ❤️</p>
      <p class="mt-1">Collect from the stall tonight!</p>
    </footer>

  <div id="crop-modal" class="modal-overlay">
    <div class="modal-content animate-in zoom-in-95 duration-200">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold font-display text-gray-800">Crop your photo</h3>
      </div>
      <div class="cropper-container">
        <img id="crop-image" src="" alt="Crop preview" />
      </div>
      <div class="flex gap-3 justify-end">
        <button id="crop-cancel" class="px-5 py-3 text-gray-600 font-bold bg-gray-100 rounded-xl hover:bg-gray-200 transition-colors w-1/2">Cancel</button>
        <button id="crop-confirm" class="px-5 py-3 bg-gradient-to-r from-teal-500 to-teal-600 text-white rounded-xl font-bold shadow-bingo hover:opacity-90 transition-opacity w-1/2">Save</button>
      </div>
    </div>
  </div>

  <div id="upgrade-modal" class="modal-overlay">
    <div class="modal-content animate-in zoom-in-95 duration-200 text-center">
      <div class="mx-auto w-12 h-12 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mb-4">
        <i data-lucide="sparkles" class="w-6 h-6"></i>
      </div>
      <h3 id="upgrade-title" class="text-xl font-bold font-display text-gray-800 mb-2">Upgrade Pack?</h3>
      <p id="upgrade-text" class="text-gray-500 mb-6">You've selected more photos than your current pack allows.</p>
      <div class="flex gap-3">
        <button id="upgrade-cancel" class="flex-1 px-4 py-3 text-gray-600 font-bold bg-gray-100 rounded-xl hover:bg-gray-200">No, remove extras</button>
        <button id="upgrade-confirm" class="flex-1 px-4 py-3 bg-gradient-to-r from-pink-500 to-pink-600 text-white rounded-xl font-bold shadow-pink hover:opacity-90">Yes, Upgrade!</button>
      </div>
    </div>
  </div>

  <script>
    // Icons
    lucide.createIcons();

    // UPDATED BINGO CONFIGURATION
    const packs = [
      { id: "1", count: 1, price: 4 },
      { id: "3", count: 3, price: 10 },
      { id: "6", count: 6, price: 20, popular: true },
      { id: "12", count: 12, price: 35 },
    ];

    let state = {
      selectedPack: "6",
      files: []
    };

    // Elements
    const packGrid = document.getElementById('pack-grid');
    const imageGrid = document.getElementById('image-grid');
    const counterText = document.getElementById('counter-text');
    const submitBtn = document.getElementById('submit-btn');
    const detailsSection = document.getElementById('details-section');
    const fileInput = document.getElementById('fileInput');
    
    // Modal Elements
    const upgradeModal = document.getElementById('upgrade-modal');
    const upgradeTitle = document.getElementById('upgrade-title');
    const upgradeText = document.getElementById('upgrade-text');
    const upgradeConfirm = document.getElementById('upgrade-confirm');
    const upgradeCancel = document.getElementById('upgrade-cancel');

    // --- RENDER ---

    function renderPacks() {
      packGrid.innerHTML = packs.map(pack => {
        const isSelected = state.selectedPack === pack.id;
        const activeClass = isSelected 
          ? "border-pink-500 bg-pink-50 shadow-pink ring-2 ring-pink-500" 
          : "border-gray-200 bg-white hover:border-teal-300 hover:bg-teal-50";
        
        return `
          <div class="relative ${pack.popular ? 'col-span-2' : ''}" onclick="trySelectPack('${pack.id}')">
            ${pack.popular ? `
              <span class="absolute -top-3 left-1/2 -translate-x-1/2 z-10 bg-gradient-hot text-white text-[10px] font-bold px-3 py-0.5 rounded-full whitespace-nowrap shadow-sm flex items-center gap-1">
                🔥 MOST POPULAR
              </span>
            ` : ''}
            <button class="w-full p-3 sm:p-4 rounded-2xl border-2 transition-all duration-200 active:scale-95 text-left ${activeClass}">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <p class="font-display text-lg sm:text-2xl font-bold text-gray-800">${pack.count} ${pack.count==1?'magnet':'magnets'}</p>
                  <p class="text-gray-500 text-xs font-semibold">£${(pack.price/pack.count).toFixed(2)} each</p>
                </div>
                <p class="font-display text-2xl sm:text-3xl font-bold text-gradient-party">£${pack.price.toFixed(2)}</p>
              </div>
            </button>
          </div>
        `;
      }).join('');
    }

    function renderImages() {
      const required = getRequiredCount();
      let html = '';

      state.files.forEach(img => {
        html += `
          <div class="relative aspect-square rounded-xl overflow-hidden shadow-sm border border-gray-200 group animate-in zoom-in duration-300">
            <img src="${img.preview}" class="w-full h-full object-cover">
            <button onclick="removeImage('${img.id}')" class="absolute top-1 right-1 w-8 h-8 bg-red-500 rounded-full flex items-center justify-center text-white shadow-lg active:scale-90 transition-transform">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
        `;
      });

      const remaining = required - state.files.length;
      for (let i = 0; i < remaining; i++) {
        html += `
          <div onclick="document.getElementById('fileInput').click()" class="aspect-square rounded-xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center bg-gray-50 cursor-pointer hover:border-teal-400 hover:bg-teal-50 transition-all active:scale-95 group">
            <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center group-hover:scale-110 transition-transform">
              <svg class="w-5 h-5 text-gray-400 group-hover:text-teal-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </div>
          </div>
        `;
      }

      imageGrid.innerHTML = html;
      counterText.textContent = `${state.files.length}/${required}`;
      counterText.className = `font-display text-2xl font-bold transition-colors ${state.files.length === required ? 'text-teal-600' : 'text-gray-300'}`;
      
      updateUIState();
    }

    function updateUIState() {
      const required = getRequiredCount();
      const isComplete = state.files.length === required;
      const pack = packs.find(p => p.id === state.selectedPack);

      if (isComplete) {
        detailsSection.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.className = "w-full py-5 rounded-2xl font-display text-xl font-bold transition-all duration-300 bg-gradient-hot text-white shadow-pink animate-pulse-glow active:scale-95 hover:opacity-90";
        document.getElementById('submit-text').innerHTML = `
          PAY £${pack.price.toFixed(2)} NOW
        `;
      } else {
        detailsSection.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.className = "w-full py-5 rounded-2xl font-display text-xl font-bold transition-all duration-300 bg-gray-100 text-gray-400 cursor-not-allowed";
        const needed = required - state.files.length;
        document.getElementById('submit-text').textContent = `Add ${needed} more photo${needed>1?'s':''}`;
      }
    }

    // --- LOGIC ---

    function getRequiredCount() {
      return packs.find(p => p.id === state.selectedPack)?.count || 0;
    }

    // --- NEW: UPGRADE / DOWNGRADE LOGIC ---
    let pendingPackId = null;

    window.trySelectPack = (id) => {
      const newPack = packs.find(p => p.id === id);
      const currentCount = state.files.length;

      // If downsizing and we have too many photos
      if (currentCount > newPack.count) {
        pendingPackId = id;
        const diff = currentCount - newPack.count;
        upgradeTitle.innerText = "Too many photos!";
        upgradeText.innerText = `This pack only allows ${newPack.count} photos. You have ${currentCount}. Remove ${diff} photos?`;
        upgradeConfirm.innerText = `Remove ${diff} Photos`;
        upgradeCancel.innerText = "Cancel";
        
        // Re-purpose the modal for downgrading logic
        upgradeConfirm.onclick = confirmDowngrade;
        upgradeCancel.onclick = () => { upgradeModal.style.display = 'none'; };
        upgradeModal.style.display = 'flex';
        return;
      }

      state.selectedPack = id;
      renderPacks();
      renderImages();
    };

    function confirmDowngrade() {
      const newPack = packs.find(p => p.id === pendingPackId);
      state.files = state.files.slice(0, newPack.count); // Trim excess
      state.selectedPack = pendingPackId;
      upgradeModal.style.display = 'none';
      renderPacks();
      renderImages();
    }

    // --- NEW: FILE UPLOAD LOGIC WITH UPGRADE PROMPT ---
    fileInput.addEventListener('change', (e) => {
      if (!e.target.files.length) return;
      
      const required = getRequiredCount();
      const current = state.files.length;
      const adding = e.target.files.length;
      const total = current + adding;

      // Check if we are exceeding the current pack
      if (total > required) {
        // Find next biggest pack
        const nextPack = packs.find(p => p.count >= total);
        
        if (nextPack && nextPack.id !== state.selectedPack) {
          // PROMPT UPGRADE
          pendingFiles = Array.from(e.target.files);
          pendingPackId = nextPack.id;
          
          upgradeTitle.innerText = "Upgrade Pack?";
          upgradeText.innerText = `You added ${total} photos total. Upgrade to the ${nextPack.count}-magnet pack for £${nextPack.price}?`;
          upgradeConfirm.innerText = `Yes, Upgrade to £${nextPack.price}`;
          upgradeCancel.innerText = "No, keep current pack";
          
          upgradeConfirm.onclick = confirmUpgrade;
          upgradeCancel.onclick = () => {
            // If they cancel, only add what fits
            const slotsLeft = required - current;
            if (slotsLeft > 0) {
              const toAdd = Array.from(e.target.files).slice(0, slotsLeft);
              processCropQueue(toAdd);
            }
            upgradeModal.style.display = 'none';
            fileInput.value = "";
          };
          
          upgradeModal.style.display = 'flex';
          return;
        }
      }

      // Standard behavior (fill up to limit)
      const slotsLeft = required - current;
      if (slotsLeft > 0) {
        const newFiles = Array.from(e.target.files).slice(0, slotsLeft);
        processCropQueue(newFiles);
      }
      fileInput.value = ""; 
    });

    let pendingFiles = [];
    function confirmUpgrade() {
      state.selectedPack = pendingPackId;
      processCropQueue(pendingFiles);
      upgradeModal.style.display = 'none';
      renderPacks(); // Will update UI to show new pack selected
    }

    window.removeImage = (id) => {
      state.files = state.files.filter(f => f.id !== id);
      renderImages();
    };

    // --- CROPPER ---
    let cropper = null;
    let currentTask = null; 
    const modal = document.getElementById('crop-modal');
    const cropImg = document.getElementById('crop-image');

    async function processCropQueue(files) {
      for (const file of files) {
        await new Promise(resolve => {
          startCropper(file, resolve);
        });
      }
      renderImages();
    }

    function startCropper(file, resolve) {
      currentTask = { file, resolve };
      const reader = new FileReader();
      reader.onload = (e) => {
        cropImg.src = e.target.result;
        modal.style.display = "flex";
        if (cropper) cropper.destroy();
        cropper = new Cropper(cropImg, {
          aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 1, background: false, guides: false, center: false, highlight: false, toggleDragModeOnDblclick: false,
        });
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('crop-confirm').onclick = () => {
      if (!cropper || !currentTask) return;
      cropper.getCroppedCanvas({ width: 1200, height: 1200, imageSmoothingQuality: 'high' }).toBlob((blob) => {
        const previewUrl = URL.createObjectURL(blob);
        state.files.push({ id: crypto.randomUUID(), file: currentTask.file, preview: previewUrl, blob: blob });
        closeModal();
        currentTask.resolve();
      }, 'image/jpeg', 0.95);
    };

    document.getElementById('crop-cancel').onclick = () => {
      closeModal();
      if (currentTask) currentTask.resolve(); 
    };

    function closeModal() {
      modal.style.display = "none";
      if (cropper) { cropper.destroy(); cropper = null; }
    }

    // --- PAYMENT SUBMISSION ---
    submitBtn.onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!email || !phone) {
        if(!email) document.getElementById('email').classList.add('ring-2', 'ring-red-500');
        if(!phone) document.getElementById('phone').classList.add('ring-2', 'ring-red-500');
        alert("Please enter your email and phone so we can send your receipt!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `Processing...`;

      try {
        const res = await fetch("/api/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email, phone, packSize: state.selectedPack, packType: 'standard', socialPermission: true, shippingMethod: "GI_COLLECT", event: "BINGO"
          })
        });

        if (!res.ok) throw new Error("API Error");
        const { orderId } = await res.json();

        submitBtn.innerHTML = `Uploading...`;
        for (const item of state.files) {
          const form = new FormData();
          const fname = (item.file.name || "photo.jpg").replace(/\.[^/.]+$/, "") + ".jpg";
          form.append("file", item.blob, fname);
          await fetch(`/api/upload?orderId=${encodeURIComponent(orderId)}`, { method: "POST", body: form });
        }

        submitBtn.innerHTML = `Redirecting...`;
        const ckRes = await fetch("/api/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            orderId, email, packSize: state.selectedPack, packType: 'standard', country: "GI_COLLECT"
          })
        });

        const { checkoutUrl } = await ckRes.json();
        window.location.href = checkoutUrl;

      } catch (err) {
        console.error(err);
        alert("Connection error. Please try again!");
        submitBtn.disabled = false;
        updateUIState();
      }
    };

    ['email', 'phone'].forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
        e.target.classList.remove('ring-2', 'ring-red-500');
      });
    });

    renderPacks();
    renderImages();
  </script>
</body>
</html>
