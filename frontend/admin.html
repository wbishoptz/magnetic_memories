<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin – Magnetic Memories</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- JSZip for "Download all images" -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
      body {
        background: #050608;
        color: #f9fafb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 24px;
      }

      .admin-shell {
        width: 100%;
        max-width: 1200px;
        background: #050608;
        border-radius: 18px;
        border: 1px solid #1f2933;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.75);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        padding: 18px 22px;
        border-bottom: 1px solid #1f2933;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: radial-gradient(circle at top left, #111827, #050608);
      }

      header h1 {
        font-size: 20px;
        margin: 0 0 2px;
      }

      header p {
        margin: 0;
        font-size: 12px;
        color: #9ca3af;
      }

      .key-badge {
        font-size: 11px;
        background: #111827;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #374151;
        color: #d1d5db;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 0;
        height: 100%;
        min-height: 420px;
      }

      .panel {
        padding: 18px 18px 20px;
        overflow: auto;
      }

      .panel + .panel {
        border-left: 1px solid #1f2933;
      }

      .panel h2 {
        font-size: 14px;
        margin: 0 0 8px;
      }

      .panel small {
        color: #9ca3af;
        font-size: 12px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 6px;
      }

      .toolbar input,
      .toolbar select {
        background: #020617;
        border-radius: 999px;
        border: 1px solid #374151;
        padding: 6px 10px;
        font-size: 12px;
        color: #e5e7eb;
      }

      .toolbar input {
        min-width: 180px;
      }

      .toolbar select {
        min-width: 140px;
      }

      .toolbar button {
        border-radius: 999px;
        border: none;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        background: #111827;
        border: 1px solid #374151;
        color: #e5e7eb;
      }

      .toolbar button:hover {
        background: #1f2937;
      }

      .table-wrapper {
        margin-top: 6px;
        border-radius: 10px;
        border: 1px solid #1f2933;
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      thead {
        background: #111827;
      }

      th,
      td {
        padding: 8px 10px;
        white-space: nowrap;
        text-align: left;
      }

      th {
        font-weight: 500;
        color: #9ca3af;
        border-bottom: 1px solid #1f2933;
        position: sticky;
        top: 0;
        background: #111827;
        z-index: 1;
      }

      tbody tr {
        cursor: pointer;
        border-bottom: 1px solid #111827;
      }

      tbody tr:hover {
        background: rgba(55, 65, 81, 0.35);
      }

      tbody tr.selected {
        background: rgba(59, 130, 246, 0.25);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 500;
      }

      .status-pill.paid,
      .status-pill.printing,
      .status-pill.shipped,
      .status-pill.completed {
        background: rgba(16, 185, 129, 0.2);
        color: #6ee7b7;
      }

      .status-pill.checkout_created,
      .status-pill.pending,
      .status-pill.draft {
        background: rgba(245, 158, 11, 0.18);
        color: #fbbf24;
      }

      .status-pill.error {
        background: rgba(248, 113, 113, 0.18);
        color: #fecaca;
      }

      .status-pill.unknown {
        background: rgba(148, 163, 184, 0.2);
        color: #e5e7eb;
      }

      .empty-state {
        padding: 40px 16px;
        text-align: center;
        color: #9ca3af;
        font-size: 13px;
      }

      .field-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9ca3af;
        margin-bottom: 3px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .field-value {
        font-size: 13px;
        margin-bottom: 12px;
        word-break: break-all;
      }

      pre.json {
        background: #020617;
        border-radius: 10px;
        padding: 10px 12px;
        border: 1px solid #1f2937;
        font-size: 12px;
        overflow: auto;
        max-height: 260px;
      }

      .input-inline {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .input-inline input,
      .input-inline select {
        background: #020617;
        border-radius: 999px;
        border: 1px solid #374151;
        padding: 6px 10px;
        font-size: 12px;
        color: #e5e7eb;
        min-width: 160px;
      }

      .input-inline button {
        border-radius: 999px;
        border: none;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        background: #16a34a;
        color: #f9fafb;
      }

      .input-inline button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        border-radius: 999px;
        padding: 2px 8px;
        background: #111827;
        border: 1px solid #1f2933;
        color: #9ca3af;
      }

      .small-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .images-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
      }

      .image-thumb {
        width: 90px;
      }

      .image-thumb img {
        width: 100%;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #1f2933;
        background: #020617;
        display: block;
      }

      .image-thumb a {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        color: #93c5fd;
        text-decoration: none;
      }

      .image-thumb a:hover {
        text-decoration: underline;
      }

      @media (max-width: 900px) {
        body {
          padding: 12px;
        }
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .panel + .panel {
          border-left: none;
          border-top: 1px solid #1f2933;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <header>
        <div>
          <h1>Magnetic Memories – Admin</h1>
          <p id="header-subtitle">Enter your admin key to load orders.</p>
        </div>
        <div class="input-inline" id="key-form">
          <input
            id="admin-key-input"
            type="password"
            placeholder="Admin key"
            autocomplete="off"
          />
          <button id="save-key-btn">Unlock</button>
        </div>
        <div class="key-badge" id="key-badge" style="display: none">
          Admin mode
        </div>
      </header>

      <div class="layout">
        <!-- Orders list -->
        <section class="panel">
          <div class="small-flex">
            <div>
              <h2>Orders</h2>
              <small id="orders-subtitle">Locked</small>
            </div>
            <span class="tag" id="orders-count">0 orders</span>
          </div>

          <div class="toolbar">
            <input
              id="search-input"
              type="text"
              placeholder="Search email or order ID"
            />
            <select id="status-filter">
              <option value="">All statuses</option>
              <option value="paid">paid</option>
              <option value="printing">printing</option>
              <option value="shipped">shipped</option>
              <option value="completed">completed</option>
              <option value="checkout_created">checkout_created</option>
              <option value="draft">draft</option>
            </select>
            <button id="download-csv-btn">Download CSV</button>
          </div>

          <div class="toolbar" style="margin-top: 0">
            <span class="tag" id="pack-summary">Pack summary: –</span>
          </div>

          <div id="orders-container" class="table-wrapper">
            <div class="empty-state">
              Enter the admin key above to load orders.
            </div>
          </div>
        </section>

        <!-- Order details -->
        <section class="panel">
          <h2>Order details</h2>
          <small id="details-subtitle">Select an order from the left.</small>

          <div id="details-container" class="empty-state">
            No order selected.
          </div>
        </section>
      </div>
    </div>

    <script>
      const keyInput = document.getElementById("admin-key-input");
      const saveKeyBtn = document.getElementById("save-key-btn");
      const keyForm = document.getElementById("key-form");
      const keyBadge = document.getElementById("key-badge");
      const headerSubtitle = document.getElementById("header-subtitle");
      const ordersSubtitle = document.getElementById("orders-subtitle");
      const ordersContainer = document.getElementById("orders-container");
      const ordersCountEl = document.getElementById("orders-count");
      const detailsContainer = document.getElementById("details-container");
      const detailsSubtitle = document.getElementById("details-subtitle");
      const searchInput = document.getElementById("search-input");
      const statusFilter = document.getElementById("status-filter");
      const downloadCsvBtn = document.getElementById("download-csv-btn");
      const packSummaryEl = document.getElementById("pack-summary");

      let adminKey = null;
      let orders = [];
      let filteredOrders = [];
      let selectedOrderId = null;
      let lastImagesForOrder = {}; // orderId -> images[]

      // ----- init key from URL or local storage -----
      (function initKey() {
        const urlParams = new URLSearchParams(window.location.search);
        const fromUrl = urlParams.get("key");
        const fromStorage = localStorage.getItem("mm_admin_key");

        if (fromUrl) {
          adminKey = fromUrl;
          localStorage.setItem("mm_admin_key", adminKey);
        } else if (fromStorage) {
          adminKey = fromStorage;
        }

        if (adminKey) {
          keyInput.value = "••••••••";
          keyInput.type = "password";
          keyBadge.style.display = "inline-flex";
          keyForm.style.opacity = "0.3";
          keyForm.style.pointerEvents = "none";
          headerSubtitle.textContent = "Loading latest orders…";
          loadOrders();
        }
      })();

      saveKeyBtn.addEventListener("click", () => {
        const value = keyInput.value.trim();
        if (!value) return;

        adminKey = value;
        localStorage.setItem("mm_admin_key", adminKey);
        headerSubtitle.textContent = "Loading latest orders…";
        keyBadge.style.display = "inline-flex";
        loadOrders();
      });

      searchInput.addEventListener("input", applyFilters);
      statusFilter.addEventListener("change", applyFilters);

      downloadCsvBtn.addEventListener("click", () => {
        if (!filteredOrders.length) {
          alert("No orders to export.");
          return;
        }
        const rows = [
          [
            "orderId",
            "email",
            "packSize",
            "price",
            "status",
            "createdAt",
          ],
        ];
        for (const o of filteredOrders) {
          rows.push([
            o.orderId,
            o.email || "",
            o.packSize ?? "",
            o.price ?? "",
            o.status || "",
            o.createdAt || "",
          ]);
        }
        const csv = rows
          .map((r) =>
            r
              .map((v) =>
                String(v)
                  .replace(/"/g, '""')
                  .includes(",")
                  ? `"${String(v).replace(/"/g, '""')}"`
                  : String(v)
              )
              .join(",")
          )
          .join("\n");

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "magnetic-memories-orders.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      async function loadOrders() {
        if (!adminKey) return;

        ordersContainer.innerHTML =
          '<div class="empty-state">Loading orders…</div>';
        ordersSubtitle.textContent = "Loading orders…";

        try {
          const res = await fetch(
            `/api/admin-orders?key=${encodeURIComponent(adminKey)}`,
            { cache: "no-store" }
          );

          if (res.status === 401) {
            headerSubtitle.textContent = "Invalid admin key.";
            ordersSubtitle.textContent = "Unauthorized";
            ordersContainer.innerHTML =
              '<div class="empty-state">Invalid key. Try again.</div>';
            keyForm.style.opacity = "1";
            keyForm.style.pointerEvents = "auto";
            keyBadge.style.display = "none";
            localStorage.removeItem("mm_admin_key");
            return;
          }

          if (!res.ok) {
            throw new Error("HTTP " + res.status);
          }

          const data = await res.json();
          orders = data.orders || [];
          applyFilters(); // sets filteredOrders + renders + pack summary
        } catch (err) {
          console.error("Failed to load orders", err);
          ordersContainer.innerHTML =
            '<div class="empty-state">Error loading orders.</div>';
          ordersSubtitle.textContent = "Error loading orders";
        }
      }

      function applyFilters() {
        const q = searchInput.value.trim().toLowerCase();
        const statusVal = statusFilter.value;

        filteredOrders = orders.filter((o) => {
          if (statusVal && o.status !== statusVal) return false;

          if (!q) return true;

          const haystack = `${o.orderId || ""} ${o.email || ""}`.toLowerCase();
          return haystack.includes(q);
        });

        renderOrders();
        updatePackSummary();
      }

      function updatePackSummary() {
        if (!orders.length) {
          packSummaryEl.textContent = "Pack summary: –";
          return;
        }

        const counts = new Map();
        for (const o of orders) {
          if (!o.packSize) continue;
          const k = String(o.packSize);
          counts.set(k, (counts.get(k) || 0) + 1);
        }

        if (!counts.size) {
          packSummaryEl.textContent = "Pack summary: –";
          return;
        }

        const parts = [];
        const sorted = Array.from(counts.entries()).sort(
          (a, b) => Number(a[0]) - Number(b[0])
        );
        for (const [size, count] of sorted) {
          parts.push(`${count}× ${size}-pack`);
        }

        packSummaryEl.textContent = "Pack summary: " + parts.join(" · ");
      }

      function renderOrders() {
        if (!filteredOrders.length) {
          ordersContainer.innerHTML =
            '<div class="empty-state">No orders match your filters.</div>';
          ordersSubtitle.textContent = "No orders";
          ordersCountEl.textContent = "0 orders";
          return;
        }

        ordersSubtitle.textContent = "Newest first";
        ordersCountEl.textContent =
          filteredOrders.length === 1
            ? "1 order"
            : `${filteredOrders.length} orders`;

        let html = '<div class="table-wrapper"><table><thead><tr>';
        html += "<th>Created</th><th>Status</th><th>Email</th><th>Pack</th><th>£</th>";
        html += "</tr></thead><tbody>";

        for (const o of filteredOrders) {
          const created = o.createdAt
            ? new Date(o.createdAt).toLocaleString()
            : "–";
          const statusClass =
            "status-pill " + (o.status ? o.status.replace(/\s+/g, "_") : "unknown");
          const isSelected = o.orderId === selectedOrderId ? " selected" : "";

          html += `<tr data-order-id="${o.orderId}" class="${isSelected}">`;
          html += `<td>${created}</td>`;
          html += `<td><span class="${statusClass}">${o.status}</span></td>`;
          html += `<td>${o.email || "–"}</td>`;
          html += `<td>${o.packSize || "?"}</td>`;
          html += `<td>${typeof o.price === "number" ? o.price.toFixed(2) : "–"}</td>`;
          html += "</tr>";
        }

        html += "</tbody></table></div>";
        ordersContainer.innerHTML = html;

        const rows = ordersContainer.querySelectorAll("tbody tr");
        rows.forEach((row) => {
          row.addEventListener("click", () => {
            const id = row.getAttribute("data-order-id");
            selectedOrderId = id;
            rows.forEach((r) => r.classList.remove("selected"));
            row.classList.add("selected");
            loadOrderDetails(id);
          });
        });
      }

      async function loadOrderDetails(orderId) {
        detailsContainer.innerHTML =
          '<div class="empty-state">Loading order details…</div>';
        detailsSubtitle.textContent = "Loading…";

        try {
          const res = await fetch(
            `/api/admin-orders?orderId=${encodeURIComponent(
              orderId
            )}&key=${encodeURIComponent(adminKey)}`,
            { cache: "no-store" }
          );

          if (!res.ok) {
            throw new Error("HTTP " + res.status);
          }

          const data = await res.json();
          const order = data.order;

          if (!order) {
            detailsContainer.innerHTML =
              '<div class="empty-state">Order not found.</div>';
            detailsSubtitle.textContent = "Order not found";
            return;
          }

          const created = order.createdAt
            ? new Date(order.createdAt).toLocaleString()
            : "–";

          const statusClass =
            "status-pill " +
            (order.status ? order.status.replace(/\s+/g, "_") : "unknown");

          let html = "";

          html += `<div class="field-label">Order ID</div>`;
          html += `<div class="field-value">${order.orderId || orderId}</div>`;

          html += `<div class="field-label">Status</div>`;
          html += `<div class="field-value">
              <span class="${statusClass}" id="status-pill-detail">${order.status}</span>
            </div>`;

          html += `<div class="field-value">
              <div class="input-inline">
                <select id="status-select">
                  <option value="paid">paid</option>
                  <option value="printing">printing</option>
                  <option value="shipped">shipped</option>
                  <option value="completed">completed</option>
                  <option value="checkout_created">checkout_created</option>
                  <option value="draft">draft</option>
                </select>
                <button id="status-update-btn">Update status</button>
              </div>
            </div>`;

          html += `<div class="field-label">Customer</div>`;
          html += `<div class="field-value">${
            order.email || "Unknown email"
          }</div>`;

          html += `<div class="field-label">Pack</div>`;
          html += `<div class="field-value">${
            order.packSize || "?"
          } magnets – £${order.price?.toFixed?.(2) ?? order.price ?? "?"}</div>`;

          html += `<div class="field-label">Created</div>`;
          html += `<div class="field-value">${created}</div>`;

          if (order.stripeSessionId) {
            html += `<div class="field-label">Stripe session</div>`;
            html += `<div class="field-value">${order.stripeSessionId}</div>`;
          }

          if (order.stripePaymentIntentId) {
            html += `<div class="field-label">Payment intent</div>`;
            html += `<div class="field-value">${order.stripePaymentIntentId}</div>`;
          }

          html += `<div class="field-label">
              <span>Images</span>
              <button id="download-all-btn" style="font-size:11px;padding:4px 8px;">Download all</button>
            </div>`;
          html += `<div class="field-value" id="images-container">Loading images…</div>`;

          html += `<div class="field-label">Raw JSON</div>`;
          html += `<pre class="json">${escapeHtml(
            JSON.stringify(order, null, 2)
          )}</pre>`;

          detailsContainer.innerHTML = html;
          detailsSubtitle.textContent = "Full order payload";

          // Status select setup
          const statusSelect = document.getElementById("status-select");
          const statusUpdateBtn = document.getElementById("status-update-btn");
          const statusPillDetail =
            document.getElementById("status-pill-detail");

          if (statusSelect) {
            if (
              Array.from(statusSelect.options).some(
                (o) => o.value === order.status
              )
            ) {
              statusSelect.value = order.status;
            } else {
              statusSelect.value = "paid";
            }

            statusUpdateBtn.addEventListener("click", async () => {
              const newStatus = statusSelect.value;
              statusUpdateBtn.disabled = true;
              statusUpdateBtn.textContent = "Updating…";
              try {
                const res = await fetch(
                  `/api/admin-order-update?key=${encodeURIComponent(
                    adminKey
                  )}`,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ orderId, status: newStatus }),
                  }
                );

                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                const updated = data.order;

                statusPillDetail.textContent = updated.status;
                statusPillDetail.className =
                  "status-pill " +
                  (updated.status
                    ? updated.status.replace(/\s+/g, "_")
                    : "unknown");

                const idx = orders.findIndex((o) => o.orderId === orderId);
                if (idx !== -1) {
                  orders[idx].status = updated.status;
                  applyFilters();
                }
              } catch (err) {
                console.error("Failed to update status", err);
                alert("Failed to update status – see console.");
              } finally {
                statusUpdateBtn.disabled = false;
                statusUpdateBtn.textContent = "Update status";
              }
            });
          }

          // Load images + hook up "Download all"
          await loadOrderImages(orderId);
          const downloadAllBtn = document.getElementById("download-all-btn");
          if (downloadAllBtn) {
            downloadAllBtn.addEventListener("click", () =>
              downloadAllImages(orderId)
            );
          }
        } catch (err) {
          console.error("Failed to load order details", err);
          detailsContainer.innerHTML =
            '<div class="empty-state">Error loading order details.</div>';
          detailsSubtitle.textContent = "Error";
        }
      }

      async function loadOrderImages(orderId) {
        const container = document.getElementById("images-container");
        if (!container) return;

        container.textContent = "Loading images…";

        try {
          const res = await fetch(
            `/api/admin-order-images?orderId=${encodeURIComponent(
              orderId
            )}&key=${encodeURIComponent(adminKey)}`,
            { cache: "no-store" }
          );

          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          const images = data.images || [];
          lastImagesForOrder[orderId] = images;

          if (!images.length) {
            container.textContent = "No images found for this order.";
            return;
          }

          let html = '<div class="images-grid">';
          for (const img of images) {
            const key = encodeURIComponent(img.key);
            const imgUrl = `/api/admin-order-image?orderId=${encodeURIComponent(
              orderId
            )}&objectKey=${key}&key=${encodeURIComponent(adminKey)}`;
            const dlUrl = `${imgUrl}&download=1`;

            html += `<div class="image-thumb">
              <img src="${imgUrl}" alt="${img.filename}" />
              <a href="${dlUrl}">Download</a>
            </div>`;
          }
          html += "</div>";
          container.innerHTML = html;
        } catch (err) {
          console.error("Failed to load images", err);
          container.textContent = "Error loading images.";
        }
      }

      async function downloadAllImages(orderId) {
        const images = lastImagesForOrder[orderId] || [];
        if (!images.length) {
          alert("No images found for this order.");
          return;
        }

        if (!window.JSZip) {
          alert("JSZip not loaded, cannot create zip.");
          return;
        }

        const zip = new JSZip();
        const folder = zip.folder(orderId) || zip;

        try {
          for (const img of images) {
            const keyEnc = encodeURIComponent(img.key);
            const imgUrl = `/api/admin-order-image?orderId=${encodeURIComponent(
              orderId
            )}&objectKey=${keyEnc}&key=${encodeURIComponent(adminKey)}`;
            const res = await fetch(imgUrl);
            if (!res.ok) {
              console.warn("Failed to fetch image", img.key);
              continue;
            }
            const blob = await res.blob();
            const arrayBuffer = await blob.arrayBuffer();
            folder.file(img.filename || "image.jpg", arrayBuffer);
          }

          const content = await zip.generateAsync({ type: "blob" });
          const url = URL.createObjectURL(content);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${orderId}-images.zip`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error("Download all failed", err);
          alert("Failed to build zip – see console.");
        }
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
    </script>
  </body>
</html>
