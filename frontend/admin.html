<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin – Magnetic Memories</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      body { background: #050608; color: #f9fafb; font-family: system-ui, sans-serif; min-height: 100vh; margin: 0; display: flex; justify-content: center; padding: 24px; }
      .admin-shell { width: 100%; max-width: 1200px; background: #050608; border-radius: 18px; border: 1px solid #1f2933; box-shadow: 0 24px 80px rgba(0,0,0,0.75); display: flex; flex-direction: column; overflow: hidden; }
      header { padding: 18px 22px; border-bottom: 1px solid #1f2933; display: flex; justify-content: space-between; align-items: center; background: radial-gradient(circle at top left, #111827, #050608); }
      header h1 { font-size: 20px; margin: 0 0 2px; }
      header p { margin: 0; font-size: 12px; color: #9ca3af; }
      .key-badge { font-size: 11px; background: #111827; padding: 6px 10px; border-radius: 999px; border: 1px solid #374151; color: #d1d5db; }
      
      .nav-toggle { display: flex; gap: 4px; background: #020617; padding: 4px; border-radius: 999px; border: 1px solid #1f2933; margin-left: 20px; }
      .nav-btn { background: transparent; border: none; color: #9ca3af; padding: 6px 14px; font-size: 12px; border-radius: 999px; cursor: pointer; transition: all 0.2s; }
      .nav-btn:hover { color: #e5e7eb; }
      .nav-btn.active { background: #1f2937; color: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
      
      .layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 0; height: 100%; min-height: 500px; }
      .panel { padding: 18px 18px 20px; overflow: auto; display: flex; flex-direction: column; }
      .panel + .panel { border-left: 1px solid #1f2933; }
      .panel h2 { font-size: 14px; margin: 0 0 8px; }
      .panel small { color: #9ca3af; font-size: 12px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; margin-bottom: 6px; }
      .toolbar input, .toolbar select { background: #020617; border-radius: 999px; border: 1px solid #374151; padding: 6px 10px; font-size: 12px; color: #e5e7eb; min-width: 140px; }
      .toolbar button { border-radius: 999px; border: none; padding: 6px 10px; font-size: 12px; cursor: pointer; background: #111827; border: 1px solid #374151; color: #e5e7eb; }
      .toolbar button:hover { background: #1f2937; }
      button.btn-danger { background: rgba(220, 38, 38, 0.15); color: #f87171; border: 1px solid rgba(220, 38, 38, 0.4); margin-top: 24px; width: 100%; padding: 10px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
      button.btn-danger:hover { background: rgba(220, 38, 38, 0.25); border-color: #f87171; color: #fff; }
      button.btn-action { background: rgba(102, 209, 158, 0.15); color: #66d19e; border: 1px solid rgba(102, 209, 158, 0.4); margin-top: 12px; width: 100%; padding: 10px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
      button.btn-action:hover { background: rgba(102, 209, 158, 0.25); color: #fff; border-color: #66d19e; }
      button.btn-action:disabled { opacity: 0.5; cursor: default; }
      .table-wrapper { margin-top: 6px; border-radius: 10px; border: 1px solid #1f2933; overflow: hidden; flex: 1; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      thead { background: #111827; }
      th, td { padding: 8px 10px; white-space: nowrap; text-align: left; }
      th { font-weight: 500; color: #9ca3af; border-bottom: 1px solid #1f2933; position: sticky; top: 0; background: #111827; z-index: 1; }
      tbody tr { cursor: pointer; border-bottom: 1px solid #111827; }
      tbody tr:hover { background: rgba(55, 65, 81, 0.35); }
      tbody tr.selected { background: rgba(59, 130, 246, 0.25); }
      .status-pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 500; }
      .status-pill.paid, .status-pill.printing, .status-pill.shipped, .status-pill.completed { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
      .status-pill.draft { background: rgba(148, 163, 184, 0.2); color: #9ca3af; }
      .status-pill.abandoned { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
      .status-pill.error { background: rgba(248, 113, 113, 0.18); color: #fecaca; }
      .email-sent-badge { font-size: 10px; margin-left: 6px; color: #66d19e; border: 1px solid #66d19e; padding: 1px 5px; border-radius: 4px; }
      .empty-state { padding: 40px 16px; text-align: center; color: #9ca3af; font-size: 13px; }
      .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 16px; }
      .field-value { font-size: 13px; margin-bottom: 4px; word-break: break-all; }
      .input-inline { display: inline-flex; align-items: center; gap: 6px; }
      .input-inline input { background: #020617; border-radius: 999px; border: 1px solid #374151; padding: 6px 10px; font-size: 12px; color: #e5e7eb; min-width: 120px; }
      .input-inline button { border-radius: 999px; border: none; padding: 6px 10px; font-size: 12px; cursor: pointer; background: #16a34a; color: #f9fafb; }
      .tag { display: inline-flex; align-items: center; font-size: 11px; border-radius: 999px; padding: 2px 8px; background: #111827; border: 1px solid #1f2933; color: #9ca3af; }
      .tag.purple { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.3); font-weight: 600; }
      .small-flex { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .images-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
      .image-thumb { width: 90px; }
      .image-thumb img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #1f2933; background: #020617; display: block; }
      .image-thumb a { display: block; margin-top: 3px; font-size: 11px; color: #93c5fd; text-decoration: none; }
      .image-thumb a:hover { text-decoration: underline; }
      @media (max-width: 900px) { body { padding: 12px; } .layout { grid-template-columns: minmax(0, 1fr); } .panel + .panel { border-left: none; border-top: 1px solid #1f2933; } }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <header>
        <div style="display:flex; align-items:center;">
          <div><h1>Magnetic Memories</h1><p id="header-subtitle">Enter admin key.</p></div>
          <div class="nav-toggle">
            <button class="nav-btn active" id="nav-orders">Orders</button>
            <button class="nav-btn" id="nav-drafts">Drafts</button>
            <button class="nav-btn" id="nav-vouchers">Vouchers</button>
            <button class="nav-btn" id="nav-events">🎪 Events</button>
          </div>
        </div>
        <div class="input-inline" id="key-form"><input id="admin-key-input" type="password" placeholder="Admin key" autocomplete="off" /><button id="save-key-btn">Unlock</button></div>
        <div class="key-badge" id="key-badge" style="display: none">Admin</div>
      </header>
      
      <div class="layout">
        <section class="panel">
          <div class="small-flex">
            <div><h2 id="list-title">Orders</h2><small id="list-subtitle">Locked</small></div>
            <span class="tag" id="list-count">0</span>
          </div>
          
          <div class="toolbar" id="order-toolbar">
            <input id="search-input" type="text" placeholder="Search..." />
            <select id="date-filter"><option value="all">All time</option><option value="today">Today</option><option value="last_week" selected>Last 7 days</option><option value="last_month">Last 30 days</option></select>
            <select id="status-filter"><option value="">All statuses</option><option value="paid">paid</option><option value="printing">printing</option><option value="shipped">shipped</option><option value="completed">completed</option></select>
            <button id="download-csv-btn">Export CSV</button>
          </div>

          <div class="toolbar" id="voucher-toolbar" style="display:none;">
            <input id="voucher-search" type="text" placeholder="Search code..." />
            <span class="tag" style="margin-left:auto; color:#f0c36a;">💰 Vouchers</span>
          </div>

          <div class="toolbar" style="margin-top: 0">
            <span class="tag" id="pack-summary">Pack summary: –</span>
            <button id="basket-toggle-btn" style="margin-left:auto; padding:4px 12px; border-radius:999px; font-size:0.8rem; font-weight:600; border:1px solid #1f2933; background:#020617; color:#aaa; cursor:pointer;" title="Toggle basket feature flag">🛒 Basket: …</button>
          </div>
          
          <div id="list-container" class="table-wrapper">
            <div class="empty-state">Enter key above to load.</div>
          </div>
        </section>

        <section class="panel">
          <h2>Details</h2><small id="details-subtitle">Select an item.</small>
          <div id="details-container" class="empty-state">No item selected.</div>
        </section>
      </div>
    </div>

    <script>
      const keyInput = document.getElementById("admin-key-input");
      const saveKeyBtn = document.getElementById("save-key-btn");
      const keyForm = document.getElementById("key-form");
      const keyBadge = document.getElementById("key-badge");
      const headerSubtitle = document.getElementById("header-subtitle");
      const listContainer = document.getElementById("list-container");
      const detailsContainer = document.getElementById("details-container");
      
      const navOrders = document.getElementById("nav-orders");
      const navDrafts = document.getElementById("nav-drafts");
      const navVouchers = document.getElementById("nav-vouchers");
      const navEvents = document.getElementById("nav-events");
      let currentMode = 'orders';

      let adminKey = null;
      let orders = [], filteredOrders = [], selectedOrderId = null, lastImagesForOrder = {};
      let events = [], selectedEventId = null;
      let vouchers = [], filteredVouchers = [], selectedVoucher = null;

      (function initKey() {
        const urlParams = new URLSearchParams(window.location.search);
        const fromUrl = urlParams.get("key");
        const fromStorage = localStorage.getItem("mm_admin_key");
        if (fromUrl) { adminKey = fromUrl; localStorage.setItem("mm_admin_key", adminKey); }
        else if (fromStorage) { adminKey = fromStorage; }
        
        if (adminKey) { 
          keyInput.value = "••••••••"; keyInput.type = "password"; 
          keyBadge.style.display = "inline-flex"; 
          keyForm.style.opacity = "0.3"; keyForm.style.pointerEvents = "none"; 
          headerSubtitle.textContent = "Loading..."; 
          loadOrders(); 
        }
      })();

      saveKeyBtn.addEventListener("click", () => {
        const value = keyInput.value.trim(); if (!value) return;
        adminKey = value; localStorage.setItem("mm_admin_key", adminKey);
        keyBadge.style.display = "inline-flex"; 
        loadOrders();
      });

      navOrders.onclick = () => switchMode('orders');
      navDrafts.onclick = () => switchMode('drafts');
      navVouchers.onclick = () => switchMode('vouchers');
      navEvents.onclick = () => switchMode('events');

      const basketToggleBtn = document.getElementById('basket-toggle-btn');
      async function loadBasketFlag() {
        try {
          const res = await fetch('/api/feature-flags');
          const { basket } = await res.json();
          basketToggleBtn.textContent = `🛒 Basket: ${basket ? 'ON' : 'OFF'}`;
          basketToggleBtn.style.color = basket ? '#59c9a5' : '#aaa';
          basketToggleBtn.style.borderColor = basket ? '#59c9a5' : '#1f2933';
          basketToggleBtn.dataset.current = basket ? 'true' : 'false';
        } catch(e) { basketToggleBtn.textContent = '🛒 Basket: ?'; }
      }
      basketToggleBtn.addEventListener('click', async () => {
        if (!adminKey) { alert('Unlock admin first.'); return; }
        const newVal = basketToggleBtn.dataset.current !== 'true';
        basketToggleBtn.textContent = 'Saving...';
        try {
          const res = await fetch('/api/admin-basket-flag', {
            method: 'POST',
            headers: { Authorization: `Bearer ${adminKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: newVal })
          });
          if (!res.ok) throw new Error('Failed');
          await loadBasketFlag();
        } catch(e) { alert('Could not update flag.'); await loadBasketFlag(); }
      });
      loadBasketFlag();

      function switchMode(mode) {
        currentMode = mode;
        navOrders.classList.toggle('active', mode === 'orders');
        navDrafts.classList.toggle('active', mode === 'drafts');
        navVouchers.classList.toggle('active', mode === 'vouchers');
        navEvents.classList.toggle('active', mode === 'events');

        document.getElementById('voucher-toolbar').style.display = (mode === 'vouchers') ? 'flex' : 'none';

        if (mode === 'events') {
            document.getElementById('order-toolbar').style.display = 'none';
            document.getElementById('voucher-toolbar').style.display = 'none';
            document.getElementById('pack-summary').style.display = 'none';
            document.getElementById('list-title').textContent = "Events";
            document.getElementById('list-subtitle').textContent = "In-person raffle uploads";
            loadEvents();
            return;
        }

        if (mode === 'orders') {
            document.getElementById('order-toolbar').style.display = 'flex';
            document.getElementById('status-filter').parentElement.style.display = 'block'; 
            document.getElementById('pack-summary').style.display = 'inline-flex';
            document.getElementById('list-title').textContent = "Orders";
            document.getElementById('list-subtitle').textContent = "Paid & Processing";
            applyFilters();
        } else if (mode === 'drafts') {
            document.getElementById('order-toolbar').style.display = 'flex';
            document.getElementById('status-filter').parentElement.style.display = 'none'; 
            document.getElementById('pack-summary').style.display = 'none';
            document.getElementById('list-title').textContent = "Drafts";
            document.getElementById('list-subtitle').textContent = "Abandoned Carts";
            applyFilters();
        } else {
            document.getElementById('order-toolbar').style.display = 'none';
            document.getElementById('pack-summary').style.display = 'none';
            document.getElementById('list-title').textContent = "Vouchers";
            document.getElementById('list-subtitle').textContent = "Active & Used";
            loadVouchers();
        }
      }

      async function loadVouchers() {
        if (!adminKey) return;
        listContainer.innerHTML = '<div class="empty-state">Loading vouchers...</div>';
        try {
            const res = await fetch(`/api/admin-vouchers`, { headers: { Authorization: `Bearer ${adminKey}` } });
            if (!res.ok) throw new Error("Auth failed");
            const data = await res.json();
            vouchers = data.vouchers || [];
            filterVouchers();
        } catch(e) {
            listContainer.innerHTML = '<div class="empty-state">Error loading vouchers. Check key.</div>';
        }
      }

      document.getElementById('voucher-search').addEventListener('input', filterVouchers);

      function filterVouchers() {
        const q = document.getElementById('voucher-search').value.trim().toUpperCase();
        filteredVouchers = vouchers.filter(v => !q || v.code.includes(q));
        renderVouchers();
      }

      function renderVouchers() {
        document.getElementById('list-count').textContent = `${filteredVouchers.length} codes`;
        let html = '<div class="table-wrapper"><table><thead><tr><th>Code</th><th>Balance</th><th>Created</th><th>Status</th></tr></thead><tbody>';
        for (const v of filteredVouchers) {
            const date = new Date(v.createdAt).toLocaleDateString();
            const isSelected = selectedVoucher === v.code ? 'selected' : '';
            let status = `<span class="status-pill paid">Active</span>`;
            if (v.balance <= 0) status = `<span class="status-pill completed">Used</span>`;
            else if (v.balance < v.value) status = `<span class="status-pill abandoned">Partial</span>`;

            html += `<tr class="${isSelected}" onclick="selectVoucher('${v.code}')">
                <td style="font-family:monospace; font-weight:bold; color:#66d19e;">${v.code}</td>
                <td>£${v.balance.toFixed(2)} <span style="color:#555; font-size:0.9em;">/ £${v.value}</span></td>
                <td>${date}</td>
                <td>${status}</td>
            </tr>`;
        }
        html += '</tbody></table></div>';
        listContainer.innerHTML = html;
      }

      window.selectVoucher = function(code) {
          selectedVoucher = code;
          const v = vouchers.find(x => x.code === code);
          renderVouchers(); 
          if (!v) return;
          
          let html = `<div class="field-label">Voucher Code</div><div class="field-value" style="font-size:1.5em; font-family:monospace; color:#66d19e;">${v.code}</div>`;
          html += `<div class="field-label">Balance Available</div><div class="field-value" style="font-size:1.2em;">£${v.balance.toFixed(2)}</div>`;
          html += `<div class="field-label">Original Value</div><div class="field-value">£${v.value.toFixed(2)}</div>`;
          html += `<div class="field-label">Purchased By</div><div class="field-value">${v.purchasedBy || "Unknown"}</div>`;
          if (v.orderId) {
             html += `<div class="field-label">Original Order</div><div class="field-value"><a href="#" onclick="switchMode('orders'); setTimeout(() => loadOrderDetails('${v.orderId}'), 500); return false;">${v.orderId}</a></div>`;
          }
          html += `<div class="field-label">Created</div><div class="field-value">${new Date(v.createdAt).toLocaleString()}</div>`;
          detailsContainer.innerHTML = html;
      }

      // ─── EVENTS TAB ────────────────────────────────────────────────
      async function loadEvents() {
        if (!adminKey) { listContainer.innerHTML = '<div class="empty-state">Enter key above to load.</div>'; return; }
        listContainer.innerHTML = '<div class="empty-state">Loading events…</div>';
        try {
          const [evRes, ordRes] = await Promise.all([
            fetch('/api/events'),
            fetch('/api/admin-orders', { headers: { Authorization: `Bearer ${adminKey}` } })
          ]);
          events = (await evRes.json()).events || [];
          orders = (await ordRes.json()).orders || [];
          renderEventManager();
        } catch (e) {
          listContainer.innerHTML = '<div class="empty-state">Error loading events.</div>';
        }
      }

      function eventOrderCount(id) {
        return orders.filter(o => o.eventId === id).length;
      }

      function renderEventManager() {
        document.getElementById('list-count').textContent = `${events.length}`;
        let html = `<div style="margin-bottom:16px; display:flex; gap:8px;">
          <button id="new-event-btn" class="btn-action" style="flex:1;">＋ New Event</button>
          <button id="test-sheet-btn" class="btn-action" style="flex:1;" title="Print a placeholder sheet to check cut sizing">📏 Test Sheet</button>
        </div>`;

        if (events.length === 0) {
          html += `<div class="empty-state">No events yet. Create one, set its ticket range, then open <code>/event.html</code> at the stall.</div>`;
        } else {
          html += '<div class="table-wrapper"><table><thead><tr><th>Event</th><th>Range</th><th>Uploads</th><th>Status</th></tr></thead><tbody>';
          for (const e of events) {
            const sel = e.id === selectedEventId ? ' selected' : '';
            const statusPill = e.active
              ? `<span class="status-pill paid">Active</span>`
              : `<span class="status-pill abandoned">Off</span>`;
            html += `<tr class="${sel}" data-event-id="${e.id}">
              <td style="font-weight:700;">${e.name}</td>
              <td style="font-family:monospace;">${e.rangeStart}–${e.rangeEnd}</td>
              <td>${eventOrderCount(e.id)}</td>
              <td>${statusPill}</td>
            </tr>`;
          }
          html += '</tbody></table></div>';
        }
        listContainer.innerHTML = html;

        document.getElementById('new-event-btn').onclick = createEvent;
        document.getElementById('test-sheet-btn').onclick = generateTestSheet;
        listContainer.querySelectorAll('tbody tr').forEach(row => {
          row.addEventListener('click', () => selectAdminEvent(row.getAttribute('data-event-id')));
        });
      }

      async function createEvent() {
        const name = prompt('Event name (e.g. Summer Fair 2026):');
        if (!name) return;
        const startStr = prompt('First ticket number:', '1');
        if (startStr === null) return;
        const endStr = prompt('Last ticket number:', '500');
        if (endStr === null) return;
        const rangeStart = parseInt(startStr, 10), rangeEnd = parseInt(endStr, 10);
        if (!Number.isInteger(rangeStart) || !Number.isInteger(rangeEnd) || rangeEnd < rangeStart) {
          return alert('Invalid range.');
        }
        try {
          const res = await fetch('/api/admin-event', {
            method: 'POST',
            headers: { Authorization: `Bearer ${adminKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'save', name, rangeStart, rangeEnd, active: true })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed');
          await loadEvents();
        } catch (e) { alert('Could not create event: ' + e.message); }
      }

      async function toggleEventActive(ev) {
        try {
          await fetch('/api/admin-event', {
            method: 'POST',
            headers: { Authorization: `Bearer ${adminKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'save', id: ev.id, name: ev.name, rangeStart: ev.rangeStart, rangeEnd: ev.rangeEnd, active: !ev.active })
          });
          await loadEvents();
          selectAdminEvent(ev.id);
        } catch (e) { alert('Could not update event.'); }
      }

      async function deleteEvent(ev) {
        if (!confirm(`Delete event "${ev.name}"?\n\nUploaded photos/orders are kept, but the event disappears from the stall page.`)) return;
        try {
          await fetch('/api/admin-event', {
            method: 'POST',
            headers: { Authorization: `Bearer ${adminKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'delete', id: ev.id })
          });
          selectedEventId = null;
          detailsContainer.innerHTML = '<div class="empty-state">Event deleted.</div>';
          await loadEvents();
        } catch (e) { alert('Could not delete event.'); }
      }

      function selectAdminEvent(id) {
        selectedEventId = id;
        renderEventManager();
        const ev = events.find(e => e.id === id);
        if (!ev) return;

        const evOrders = orders
          .filter(o => o.eventId === id)
          .sort((a, b) => (Number(a.raffleNumber) || 0) - (Number(b.raffleNumber) || 0));

        let html = `<div class="field-label">Event</div><div class="field-value" style="font-size:1.3em; font-weight:bold;">${ev.name}</div>`;
        html += `<div class="field-label">Ticket Range</div><div class="field-value" style="font-family:monospace;">${ev.rangeStart}–${ev.rangeEnd} · ${evOrders.length} uploaded</div>`;
        html += `<button id="ev-print" class="btn-action" style="width:100%; margin:10px 0; background:#059669; border-color:#059669; color:#fff; font-weight:700;">🖨️ Generate Print Sheets (9-up PDF)</button>`;
        html += `<div class="field-value" style="display:flex; gap:8px; margin:0 0 10px;">
          <button id="ev-toggle" class="btn-action" style="flex:1;">${ev.active ? 'Set Inactive' : 'Set Active'}</button>
          <button id="ev-delete" class="btn-danger" style="flex:1; margin:0;">Delete Event</button>
        </div>`;

        html += `<div class="field-label">Uploads by Ticket #</div>`;
        if (evOrders.length === 0) {
          html += `<div class="field-value" style="color:#9ca3af;">No photos uploaded yet.</div>`;
        } else {
          html += '<div class="table-wrapper"><table><thead><tr><th>Ticket</th><th>Photos</th><th>When</th></tr></thead><tbody>';
          for (const o of evOrders) {
            const created = o.createdAt ? new Date(o.createdAt).toLocaleString() : '–';
            html += `<tr data-order-id="${o.orderId}">

      // ─── PRINT SHEET GENERATOR (US Letter, 3×3, recreated magnet template) ───
      const IN = 25.4;                       // mm per inch
      const TILE = 2.8 * IN;                 // 71.12mm — full tile incl. bleed/wrap
      const PHOTO = 2.05 * IN;               // 52.07mm — visible photo face
      const PHOTO_OFF = (TILE - PHOTO) / 2;  // 9.525mm border each side
      const CHAMFER = 11;                    // octagon corner cut (mm)
      const COLS = 3, ROWS = 3, PER_PAGE = 9;
      const PAGE_W = 8.5 * IN, PAGE_H = 11 * IN; // US Letter
      const GRID_W = COLS * TILE;
      const LEFT = (PAGE_W - GRID_W) / 2;    // centred horizontally
      const ROW_GAP = 16;                    // vertical gap between rows (room for cut lines)

      // Load an <img> and resolve once decoded
      function loadImg(src) {
        return new Promise((resolve, reject) => {
          const im = new Image();
          im.onload = () => resolve(im);
          im.onerror = () => reject(new Error('Image failed to load'));
          im.src = src;
        });
      }

      // Centre-crop any photo to a square JPEG data URL (event photos are uncropped)
      function squareDataUrl(img, px = 620) {
        const canvas = document.createElement('canvas');
        canvas.width = px; canvas.height = px;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, px, px);
        const s = Math.min(img.naturalWidth, img.naturalHeight);
        const sx = (img.naturalWidth - s) / 2, sy = (img.naturalHeight - s) / 2;
        ctx.drawImage(img, sx, sy, s, s, 0, 0, px, px);
        return canvas.toDataURL('image/jpeg', 0.92);
      }

      // Draw one magnet tile: photo + octagon cut outline + number in the border
      function drawMagnetTile(pdf, x, y, item) {
        // Photo (centre-cropped square) in the middle of the tile
        pdf.addImage(item.data, 'JPEG', x + PHOTO_OFF, y + PHOTO_OFF, PHOTO, PHOTO);

        // Octagon cut outline (faint grey)
        pdf.setDrawColor(170); pdf.setLineWidth(0.15);
        const c = CHAMFER, T = TILE;
        const pts = [
          [x + c, y], [x + T - c, y],
          [x + T, y + c], [x + T, y + T - c],
          [x + T - c, y + T], [x + c, y + T],
          [x, y + T - c], [x, y + c]
        ];
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          pdf.line(a[0], a[1], b[0], b[1]);
        }

        const cx = x + T / 2, cy = y + T / 2;

        // Top border: "Magnetic Memories" — rotated 180° so it reads upright when folded round the back
        pdf.setFont('helvetica', 'normal'); pdf.setTextColor(70); pdf.setFontSize(6.5);
        pdf.text('Magnetic Memories', cx, y + (PHOTO_OFF / 2) + 1, { angle: 180, align: 'center' });

        // Left side (vertical): "Made in Gibraltar"
        pdf.setFontSize(6); pdf.setTextColor(90);
        pdf.text('Made in Gibraltar', x + (PHOTO_OFF / 2) + 1, cy, { angle: 90, align: 'center' });

        // Right side (vertical): "Personalised Magnets"
        pdf.text('Personalised Magnets', x + T - (PHOTO_OFF / 2) - 1, cy, { angle: 270, align: 'center' });

        // Bottom border: magnet number (upright, easy to read while sorting)
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11); pdf.setTextColor(40);
        pdf.text(`#${item.ticket ?? '?'}`, cx, y + T - (PHOTO_OFF / 2) + 1.5, { align: 'center' });
      }

      // Build a multi-page Letter PDF from preloaded items [{ticket, data}]
      function buildSheetPdf(items, filenameBase) {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: 'letter' });
        const totalH = ROWS * TILE + (ROWS - 1) * ROW_GAP;
        const topMargin = (PAGE_H - totalH) / 2;     // centre the grid vertically
        const rowPitch = TILE + ROW_GAP;
        const pageCount = Math.ceil(items.length / PER_PAGE);

        for (let p = 0; p < pageCount; p++) {
          if (p > 0) pdf.addPage();
          const pageItems = items.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
          const rowsUsed = Math.ceil(pageItems.length / COLS);

          // Tiles
          for (let k = 0; k < pageItems.length; k++) {
            const r = Math.floor(k / COLS), col = k % COLS;
            drawMagnetTile(pdf, LEFT + col * TILE, topMargin + r * rowPitch, pageItems[k]);
          }

          // Horizontal cut guides in the gap between each row of magnets
          pdf.setDrawColor(120); pdf.setLineWidth(0.3);
          for (let i = 1; i < rowsUsed; i++) {
            const lineY = topMargin + i * rowPitch - ROW_GAP / 2;
            pdf.line(LEFT, lineY, LEFT + GRID_W, lineY);
          }
        }

        const safe = (filenameBase || 'magnets').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '');
        pdf.save(`${safe}-print-sheets.pdf`);
        return pageCount;
      }

      // Fetch + square-crop all photos for a set of orders, return [{ticket, data}]
      async function preparePhotos(orderList, onProgress) {
        const photos = [];
        for (const o of orderList) {
          const res = await fetch(`/api/admin-order-images?orderId=${o.orderId}`, { headers: { Authorization: `Bearer ${adminKey}` } });
          const data = await res.json();
          (data.images || []).forEach(img => {
            photos.push({
              ticket: o.raffleNumber,
              src: `/api/admin-order-image?orderId=${o.orderId}&objectKey=${encodeURIComponent(img.key)}&key=${encodeURIComponent(adminKey)}`
            });
          });
        }
        const items = [];
        for (let i = 0; i < photos.length; i++) {
          if (onProgress) onProgress(i + 1, photos.length);
          const img = await loadImg(photos[i].src);
          items.push({ ticket: photos[i].ticket, data: squareDataUrl(img) });
        }
        return items;
      }

      // Placeholder tile so you can check cut alignment without real photos
      function makeTestTileDataUrl(px = 620) {
        const cv = document.createElement('canvas');
        cv.width = px; cv.height = px;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#eef6f3'; ctx.fillRect(0, 0, px, px);
        // Edge border = exact photo boundary (2.05in / 52mm)
        ctx.strokeStyle = '#059669'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, px - 4, px - 4);
        // Diagonals to find the centre
        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(px, px); ctx.moveTo(px, 0); ctx.lineTo(0, px); ctx.stroke();
        // Centre circle
        ctx.beginPath(); ctx.arc(px / 2, px / 2, px * 0.18, 0, Math.PI * 2);
        ctx.strokeStyle = '#059669'; ctx.lineWidth = 3; ctx.stroke();
        // Labels
        ctx.fillStyle = '#065f46'; ctx.textAlign = 'center';
        ctx.font = 'bold 34px sans-serif'; ctx.fillText('PHOTO', px / 2, px / 2 - 8);
        ctx.font = '24px sans-serif'; ctx.fillText('2.05in / 52mm', px / 2, px / 2 + 28);
        return cv.toDataURL('image/jpeg', 0.92);
      }

      function generateTestSheet() {
        const btn = document.getElementById('test-sheet-btn');
        const orig = btn.innerHTML;
        try {
          if (!window.jspdf) throw new Error('PDF library not loaded — refresh and retry.');
          btn.disabled = true; btn.textContent = 'Building…';
          const data = makeTestTileDataUrl();
          const items = Array.from({ length: PER_PAGE }, (_, i) => ({ ticket: 'T' + (i + 1), data }));
          buildSheetPdf(items, 'TEST-SHEET');
          btn.textContent = '✅ Downloaded';
          setTimeout(() => { btn.disabled = false; btn.innerHTML = orig; }, 2000);
        } catch (e) {
          alert('Test sheet error: ' + e.message);
          btn.disabled = false; btn.innerHTML = orig;
        }
      }

      async function generatePrintSheets(ev) {
        const btn = document.getElementById('ev-print');
        const orig = btn.innerHTML;
        btn.disabled = true; btn.textContent = 'Gathering photos…';
        try {
          if (!window.jspdf) throw new Error('PDF library not loaded — refresh and retry.');
          const evOrders = orders
            .filter(o => o.eventId === ev.id)
            .sort((a, b) => (Number(a.raffleNumber) || 0) - (Number(b.raffleNumber) || 0));

          const items = await preparePhotos(evOrders, (n, total) => { btn.textContent = `Loading ${n}/${total}…`; });
          if (items.length === 0) { alert('No photos to print for this event yet.'); btn.disabled = false; btn.innerHTML = orig; return; }

          btn.textContent = 'Building PDF…';
          const sheets = buildSheetPdf(items, ev.name);
          btn.textContent = `✅ ${sheets} sheet(s) downloaded`;
          setTimeout(() => { btn.disabled = false; btn.innerHTML = orig; }, 2500);
        } catch (e) {
          alert('Print sheet error: ' + e.message);
          btn.disabled = false; btn.innerHTML = orig;
        }
      }

      async function generateOrderSheet(order, btn) {
        const orig = btn ? btn.innerHTML : '';
        if (btn) { btn.disabled = true; btn.textContent = 'Building…'; }
        try {
          if (!window.jspdf) throw new Error('PDF library not loaded — refresh and retry.');
          const items = await preparePhotos([order], (n, total) => { if (btn) btn.textContent = `Loading ${n}/${total}…`; });
          if (items.length === 0) { alert('No photos on this ticket.'); if (btn) { btn.disabled = false; btn.innerHTML = orig; } return; }
          buildSheetPdf(items, `ticket-${order.raffleNumber ?? order.orderId}`);
          if (btn) { btn.textContent = '✅ Downloaded'; setTimeout(() => { btn.disabled = false; btn.innerHTML = orig; }, 2000); }
        } catch (e) {
          alert('Print sheet error: ' + e.message);
          if (btn) { btn.disabled = false; btn.innerHTML = orig; }
        }
      }

      document.getElementById("search-input").addEventListener("input", applyFilters);

      document.getElementById("date-filter").addEventListener("change", applyFilters);

      document.getElementById("download-csv-btn").addEventListener("click", () => {
        if (!filteredOrders.length) { alert("No orders to export."); return; }
        const rows = [["orderId", "email", "phone", "packSize", "price", "status", "shipping", "bingoNumber", "createdAt"]];
        for (const o of filteredOrders) rows.push([
            o.orderId, o.email || "", o.phone || "", o.packSize ?? "", o.price ?? "", o.status || "", o.shippingMethod || "COLLECT", o.bingoNumber || "", o.createdAt || ""
        ]);
        const csv = rows.map(r => r.map(v => String(v).replace(/"/g, '""').includes(",") ? `"${String(v).replace(/"/g, '""')}"` : String(v)).join(",")).join("\n");
        const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "magnetic-memories-orders.csv";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);

      async function loadOrders() {
        if (!adminKey) return;
        listContainer.innerHTML = '<div class="empty-state">Loading orders…</div>';
        try {
          const res = await fetch(`/api/admin-orders`, { headers: { Authorization: `Bearer ${adminKey}` } });
          if (res.status === 401) { headerSubtitle.textContent = "Invalid admin key."; listContainer.innerHTML = '<div class="empty-state">Invalid key.</div>'; return; }
          const data = await res.json();
          orders = data.orders || []; applyFilters();
        } catch (err) { listContainer.innerHTML = '<div class="empty-state">Error loading orders.</div>'; }
      }

      function applyFilters() {
        if (currentMode === 'vouchers' || currentMode === 'events') return;
        
        const q = document.getElementById("search-input").value.trim().toLowerCase();
        const statusVal = document.getElementById("status-filter").value;
        const dateVal = document.getElementById("date-filter").value;
        const now = new Date();
        let cutoff = 0;
        if (dateVal === 'today') cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        else if (dateVal === 'last_week') cutoff = now.getTime() - (7 * 86400000);
        else if (dateVal === 'last_month') cutoff = now.getTime() - (30 * 86400000);

        filteredOrders = orders.filter(o => {
          if (currentMode === 'orders') {
             if (o.eventId) return false; // event uploads live in the Events tab
             if (o.status === 'draft' || o.status === 'abandoned') return false;
             if (statusVal && o.status !== statusVal) return false;
          } else if (currentMode === 'drafts') {
             if (o.status !== 'draft' && o.status !== 'abandoned') return false;
             if (o.recoverySkipped) return false; 
          }
          if (cutoff > 0 && (new Date(o.createdAt).getTime() < cutoff)) return false;
          if (!q) return true;
          return `${o.orderId} ${o.email} ${o.phone}`.toLowerCase().includes(q);
        });
        renderOrders(); 
        if(currentMode === 'orders') updatePackSummary();
      }

      function updatePackSummary() {
        if (!orders.length) { document.getElementById("pack-summary").textContent = "Pack summary: –"; return; }
        const counts = new Map();
        for (const o of filteredOrders) {
          if (!o.packSize && !o.frameStyle && o.productType !== 'keyring') continue;
          let k = String(o.packSize || o.frameStyle);
          if (k.startsWith("voucher_")) {
             k = "Voucher £" + k.split("_")[1];
          } else if (o.productType === 'keyring') {
             k = "Double-Sided Keyring";
          } else if (o.productType === 'frame' || o.productType === 'frames') {
             k = k.charAt(0).toUpperCase() + k.slice(1) + " Frame";
          } else {
             k = k + "-pack";
             if (o.packType === 'big_picture') k += " (Jigsaw)";
          }
          counts.set(k, (counts.get(k) || 0) + 1);
        }
        if (!counts.size) { document.getElementById("pack-summary").textContent = "Pack summary: –"; return; }
        const parts = Array.from(counts.entries()).sort().map(([k, v]) => `${v}x ${k}`);
        document.getElementById("pack-summary").textContent = "Pack summary: " + parts.join(" · ");
      }

      function renderOrders() {
        document.getElementById('list-count').textContent = `${filteredOrders.length}`;
        let headerStatus = (currentMode === 'drafts') ? 'Status' : 'Status';
        let html = `<div class="table-wrapper"><table><thead><tr><th>Created</th><th>${headerStatus}</th><th>Email</th><th>Pack / Product</th><th>£</th></tr></thead><tbody>`;
        
        for (const o of filteredOrders) {
          const created = o.createdAt ? new Date(o.createdAt).toLocaleString() : "–";
          const isSelected = o.orderId === selectedOrderId ? " selected" : "";
          
          let statusDisplay = `<span class="status-pill ${o.status}">${o.status}</span>`;
          if (currentMode === 'drafts') {
              if (o.recoverySent || o.status === 'abandoned') {
                  statusDisplay = `<span class="status-pill abandoned">Abandoned</span> <span class="email-sent-badge">✉️ Sent</span>`;
              } else {
                  statusDisplay = `<span class="status-pill draft">Active Draft</span>`;
              }
          } else {
              statusDisplay = `<span class="status-pill ${(o.status||'').replace(/\s+/g, '_')}">${o.status}</span>`;
          }

          // EVENT BADGES
          if (o.event === 'BINGO') {
              let numDisplay = o.bingoNumber ? `#${o.bingoNumber}` : '';
              statusDisplay += ` <span class="tag" style="background:#f59e0b; color:black; font-weight:800; font-size:11px; border:none; box-shadow:0 2px 5px rgba(245, 158, 11, 0.4);">🎱 ${numDisplay}</span>`;
          } else if (o.event === 'VALENTINES') {
              statusDisplay += ` <span class="tag" style="background:#be123c; color:white; border:none; font-weight:700; font-size:10px;">💘 VALENTINES</span>`;
          } else if (o.event === 'MOTHERS_DAY') {
              statusDisplay += ` <span class="tag" style="background:#be185d; color:white; border:none; font-weight:700; font-size:10px;">🌸 MOTHER'S DAY</span>`;
          } else if (o.event === 'FRAMES') {
              statusDisplay += ` <span class="tag" style="background:#ea580c; color:white; border:none; font-weight:700; font-size:10px;">🖼️ FRAMES</span>`;
          }

          // SMART PACK DISPLAY
          let packDisplay = o.packSize || "?";
          let style = "";
          
          if (o.productType === 'frame' || o.productType === 'frames' || o.frameStyle) {
              const frameName = (o.frameStyle || '').charAt(0).toUpperCase() + (o.frameStyle || '').slice(1);
              packDisplay = `🖼️ ${frameName} Frame`;
              style = 'style="color: #ea580c; font-weight:600;"';
          } else if (o.productType === 'keyring') {
              packDisplay = `🔑 Double-Sided Keyring`;
              style = 'style="color: #fbbf24; font-weight:600;"';
          } else if (o.event === 'MOTHERS_DAY' && o.mothersPackage) {
              packDisplay = `🌸 ${o.mothersPackage}`;
              style = 'style="color: #be185d; font-weight:600;"';
          } else if (String(packDisplay).startsWith('voucher_')) {
              const val = packDisplay.split('_')[1];
              packDisplay = `🎁 £${val} Voucher`;
              style = 'style="color: #66d19e; font-weight:600;"';
          } else if (o.packType === 'big_picture') {
              packDisplay = '🧩 ' + packDisplay; 
              style = 'style="color: #d8b4fe; font-weight:600;"';
          }

          let priceDisplay = typeof o.price === "number" ? o.price.toFixed(2) : "–";
          if (o.usedVoucher) priceDisplay += ` <span class="tag" style="font-size:9px; color:#f0c36a;">VOUCHER</span>`;
          html += `<tr data-order-id="${o.orderId}" class="${isSelected}"><td>${created}</td><td>${statusDisplay}</td><td>${o.email || "–"}</td><td ${style}>${packDisplay}</td><td>${priceDisplay}</td></tr>`;
        }
        html += "</tbody></table></div>";
        listContainer.innerHTML = html;
        listContainer.querySelectorAll("tbody tr").forEach(row => {
          row.addEventListener("click", () => {
            selectedOrderId = row.getAttribute("data-order-id");
            renderOrders(); 
            loadOrderDetails(selectedOrderId);
          });
        });
      }

             const total = order.price + shipCost;
             html += `<div class="field-label">Total Paid</div><div class="field-value" style="font-family:monospace; font-size:1.1em;">
               £${order.price.toFixed(2)} (Product) + £${shipCost.toFixed(2)} (Ship) = <span style="color:#66d19e; font-weight:bold;">£${total.toFixed(2)}</span>
             </div>`;
          }

          // --- SOCIALS PERMISSION ---
          let socials = "";
          if (order.socialPermission === true || order.socialPermission === "true") {
              socials = `<span style="color:#10b981; font-weight:bold; border:1px solid #10b981; padding:4px 8px; border-radius:6px; background:rgba(16,185,129,0.1);">✅ SOCIALS APPROVED</span>`;
          } else if (order.socialPermission === false || order.socialPermission === "false") {
              socials = `<span style="color:#ef4444; font-weight:bold; border:1px solid #ef4444; padding:4px 8px; border-radius:6px; background:rgba(239,68,68,0.1);">❌ NO SOCIALS</span>`;
          } else {
              socials = `<span style="color:#9ca3af;">❓ UNKNOWN (No selection)</span>`;
          }

          html += `<div class="field-label" style="color:#fcd34d;">Social Media Permission</div><div class="field-value" style="font-size:1.1em; margin-bottom:12px;">${socials}</div>`;

          html += `<div class="field-label">Customer</div><div class="field-value">${order.email} <br> ${order.phone || "No phone"}</div>`;
          
          if (order.customer?.address) {
             const a = order.customer.address;
             const addr = [order.customer.name, a.line1, a.line2, a.city, a.postal_code, a.country].filter(Boolean).join("<br>");
             html += `<div class="field-label">Address</div><div class="field-value" style="background:#111827;padding:10px;border-radius:8px;">${addr}</div>`;
          }

          if (order.generatedVoucher) html += `<div class="field-label">🎁 Voucher Generated</div><div class="field-value" style="font-size:1.2em; color:#66d19e;">${order.generatedVoucher}</div>`;
          if (order.usedVoucher) html += `<div class="field-label">🏷️ Discount Used</div><div class="field-value" style="color:#f0c36a;">Code: ${order.usedVoucher}</div>`;

          // --- CONDITIONAL SMART DISPLAY ---
          if (order.productType === 'frame' || order.productType === 'frames' || order.frameStyle) {
              const style = (order.frameStyle || '').charAt(0).toUpperCase() + (order.frameStyle || '').slice(1);
              const type = order.includeMagnets ? `With ${order.frameSize} Magnets` : "Frame Only";
              html += `<div class="field-label" style="color:#ea580c;">Frame Configuration</div>
                       <div class="field-value" style="font-size:1.1em; font-weight:bold;">${style} Frame (${order.frameSize || '?'} slots)</div>
                       <div class="field-value">Color: <span style="font-weight:bold;">${order.frameColor || 'Unknown'}</span></div>
                       <div class="field-value">Type: ${type}</div>`;
          } else if (order.productType === 'keyring') {
              html += `<div class="field-label" style="color:#fbbf24;">Product</div>
                       <div class="field-value" style="font-size:1.2em; font-weight:bold;">🔑 Double-Sided Keyring</div>`;
          } else if (order.event === 'MOTHERS_DAY') {
              html += `<div class="field-label" style="color:#be185d;">Mother's Day Package</div>
                       <div class="field-value" style="font-size:1.2em; font-weight:bold;">${order.mothersPackage || "Standard Box"}</div>
                       <div class="field-value">${order.packSize} total magnets</div>`;
          } else {
              html += `<div class="field-label">Pack</div><div class="field-value">${isVoucher ? "" : order.packSize + " magnets — "}${packLabel}</div>`;
          }
          
          if (order.productType === 'flexi') {
              html += `<div class="field-label" style="color:#f97316;">🧡 Flexi Heart Color</div><div class="field-value" style="font-size:1.2em; font-weight:bold;">${order.flexiColor || "Unknown"}</div>`;
          }

          // --- PRE-MADE SELECTIONS ---
          if (order.premadeSelections && order.premadeSelections.length > 0) {
              html += `<div class="field-label" style="color:#be185d;">🌸 Design Choices</div><div class="field-value" style="display:flex; flex-wrap:wrap; gap:8px;">`;
              order.premadeSelections.forEach(name => {
                  const num = name.match(/\d+/);
                  const imgUrl = num ? `./premade-${num[0]}.jpg` : null;
                  html += `<div style="text-align:center; border: 1px solid #be185d; padding: 4px; border-radius: 8px; background: rgba(190, 24, 93, 0.05);">
                    ${imgUrl ? `<img src="${imgUrl}" style="width:60px; height:60px; object-fit:cover; border-radius:6px; display:block; margin-bottom:4px;">` : ''}
                    <span style="font-size:10px; color:#f9fafb; font-weight:bold;">${name}</span>
                  </div>`;
              });
              html += `</div>`;
          }

          if (!isVoucher) {
             html += `<div class="field-label">Images <button id="download-all-btn" style="font-size:11px;padding:4px 8px;">Download All</button></div><div class="field-value" id="imgs">Loading...</div>`;
          }
          
          if (order.eventId && !isVoucher) {
            html += `<button id="print-one-btn" class="btn-action" style="width:100%; background:#059669; border-color:#059669; color:#fff; font-weight:700;">🖨️ Print this ticket's sheet</button>`;
          }

          html += `<button id="delete-order-btn" class="btn-danger">Delete Order</button>`;
          detailsContainer.innerHTML = html;

          // Wire up interactions
          const printOneBtn = document.getElementById("print-one-btn");
          if (printOneBtn) printOneBtn.onclick = () => generateOrderSheet(order, printOneBtn);

          const updateBtn = document.getElementById("status-update-btn");
          if(updateBtn) updateBtn.onclick = async () => {
             await fetch(`/api/admin-order-update`, { method: "POST", headers: { Authorization: `Bearer ${adminKey}`, "Content-Type": "application/json" }, body: JSON.stringify({ orderId, status: document.getElementById("status-select").value }) });
             loadOrderDetails(orderId); loadOrders(); 
          };
          
          const manualRecBtn = document.getElementById("manual-recovery-btn");
          if (manualRecBtn) {
              manualRecBtn.onclick = async () => {
                  manualRecBtn.textContent = "Sending..."; manualRecBtn.disabled = true;
                  try {
                      const res = await fetch("/api/admin-send-recovery", { method: "POST", headers: { Authorization: `Bearer ${adminKey}`, "Content-Type": "application/json" }, body: JSON.stringify({ orderId }) });
                      if (res.ok) { alert("Email sent!"); loadOrderDetails(orderId); loadOrders(); } 
                      else { alert("Failed to send."); manualRecBtn.textContent = "Try Again"; manualRecBtn.disabled = false; }
                  } catch (e) { alert("Error: " + e.message); }
              };
          }

          document.getElementById("delete-order-btn").onclick = async () => {
             if(confirm("Delete forever?")) {
                 await fetch("/api/admin-order-delete", { method: "POST", headers: { Authorization: `Bearer ${adminKey}`, "Content-Type": "application/json" }, body: JSON.stringify({ orderId }) });
                 orders = orders.filter(o => o.orderId !== orderId); applyFilters(); detailsContainer.innerHTML="Deleted.";
             }
          };
          
          if (!isVoucher) {
              const dlBtn = document.getElementById("download-all-btn");
              if(dlBtn) dlBtn.onclick = () => downloadAllImages(orderId, order);
              loadOrderImages(orderId);
          }
        } catch (e) { detailsContainer.innerHTML = "Error loading details."; }
      }

      async function loadOrderImages(id) {
        const res = await fetch(`/api/admin-order-images?orderId=${id}`, { headers: { Authorization: `Bearer ${adminKey}` } });
        const data = await res.json();
        let h = '<div class="images-grid">';
        (data.images||[]).forEach(img => {
            const src = `/api/admin-order-image?orderId=${id}&objectKey=${encodeURIComponent(img.key)}&key=${adminKey}`;
            h += `<div class="image-thumb"><img src="${src}"><a href="${src}&download=1">Download</a></div>`;
        });
        document.getElementById("imgs").innerHTML = h + '</div>';
        lastImagesForOrder[id] = data.images;
      }
      
      async function downloadAllImages(orderId, order) {
        const images = lastImagesForOrder[orderId] || [];
        if (!images.length && (!order.premadeSelections || !order.premadeSelections.length)) { alert("No images found."); return; }
        const zip = new JSZip();
        
        // Add User Uploads
        for (const img of images) {
            const keyEnc = encodeURIComponent(img.key);
            const imgUrl = `/api/admin-order-image?orderId=${encodeURIComponent(orderId)}&objectKey=${keyEnc}&key=${encodeURIComponent(adminKey)}`;
            const res = await fetch(imgUrl);
            if (res.ok) zip.file(img.filename || "image.jpg", await res.blob());
        }

        // Add Premade Selections
        if(order.premadeSelections) {
            for(const name of order.premadeSelections) {
                const num = name.match(/\d+/);
                if(num) {
                    const res = await fetch(`./premade-${num[0]}.jpg`);
                    if(res.ok) zip.file(`Design-${num[0]}.jpg`, await res.blob());
                }
            }
        }

        const content = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(content); a.download = `${orderId}-images.zip`;
        document.body.appendChild(a); a.click();
      }
    </script>
  </body>
</html>
